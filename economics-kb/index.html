/* Rename a note and update every [[link]] / {{tasks:}} that points at it */
function renameNote(note, newTitle) {
  newTitle = newTitle.replace(/[\[\]|{}]/g, '').trim();
  if (!newTitle || newTitle === note.title) { $('#edTitle').value = note.title; return; }
  const clash = findByTitle(newTitle);
  if (clash && clash !== note) { toast('A note with that title already exists.'); $('#edTitle').value = note.title; return; }
  const old = normTitle(note.title);
  let changed = 0;
  state.notes.forEach(n => {
    const before = n.body;
    n.body = n.body
      .replace(LINK_RE, (m, inner) => {
        const { target, label } = parseLink(inner);
        if (normTitle(target) !== old) return m;
        return inner.includes('|') ? `[[${newTitle}|${label}]]` : `[[${newTitle}]]`;
      })
      .replace(TOKEN_RE, (m, kind, args) => (kind === 'tasks' && normTitle(args) === old ? `{{tasks:${newTitle}}}` : m));
    if (n.body !== before && n !== note) changed++;
  });
  const oldTitle = note.title;
  note.title = newTitle;
  note.aliases = [...new Set([...(note.aliases || []), oldTitle])].filter(a => normTitle(a) !== normTitle(newTitle));
  $('#edTitle').value = newTitle;
  const ta = $('#edBody');
  if (ta && ta.value !== note.body) ta.value = note.body;
  save(); renderTree(); renderRight(); renderToolbar();
  if (changed) toast(`Renamed — updated links in ${changed} note${changed === 1 ? '' : 's'}.`);
}

/* ---------- Note actions ---------- */
function currentFolder() {
  const n = getNote(state.current);
  return (n && n.folder) || 'Overview';
}
function createNote(title, folder) {
  title = String(title || '').replace(/[\[\]|{}]/g, '').trim();
  if (!title) return;
  const existing = findByTitle(title);
  if (existing) { open(existing.id); return; }
  const id = uniqueId(title);
  state.notes.push({ id, title, folder: folder || 'Overview', type: 'note', body: '', created: Date.now() });
  save();
  open(id, true);
}
function deleteNote() {
  const note = getNote(state.current);
  if (!note) return;
  if (!confirm(`Delete "${note.title}"? Links to it will show as uncreated.`)) return;
  state.notes = state.notes.filter(n => n !== note);
  save();
  toast('Note deleted.');
  open(homeId());
}

/* ==========================================================================
   11. GRAPH VIEW — a small 3D engine on <canvas> (no libraries)
   - GraphView is used twice: the full graph (Graph button) and the small
     "Local graph" panel in each note's right sidebar.
   - Tweak colours in FOLDER_COLORS / GRAPH_LOOK and physics in FORCE.
   - Settings (2D/3D, tidy, hidden groups, forces…) are saved per browser.
   ========================================================================== */

/* ---- Physics. The Forces sliders multiply repulsion, linkDistance, cluster ---- */
const FORCE = {
  repulsion: 5200,      // push between every pair of nodes
  linkDistance: 80,     // spring rest length for a link
  sameGroupLink: 0.6,   // links inside one folder use shorter springs (× linkDistance)
  spring: 0.035,        // spring stiffness
  hubSpring: 0.12,      // in Tidy mode, hub links pull this much (× spring)
  center: 0.0025,       // gentle pull to the centre
  cluster: 0.010,       // pull toward the node's folder cluster centre
  clusterRadius: 230,   // how far apart the folder clusters sit
  damping: 0.82,        // velocity kept each tick (lower = calmer)
  cooling: 0.986,       // alpha multiplier per tick; the simulation stops when settled
  minAlpha: 0.004,
  maxSpeed: 25
};

/* ---- Look ---- */
const GRAPH_LOOK = {
  edgeRGB: '150,150,160',
  edgeAlpha: 0.2,       // normal edges: thin and faint
  dimAlpha: 0.15,       // everything not related to the hovered/selected node
  hubThreshold: 8,      // notes with more links than this are "hubs"
  hubScale: 0.85,       // hubs are drawn a little smaller
  nodeMin: 3.5, nodeMax: 11,
  labelChars: 24,
  topLabels: 10,
  font: '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
  miniFont: '10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
  autoRotateSpeed: 0.0022  // radians per frame
};

const GRAPH_KEY = 'zambia-graph-v1';
const REDUCED_MOTION = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const GRAPH_DEFAULTS = { mode: '3d', autoRotate: true, tidy: true, local: false, depth: 1, miniDepth: 1, hidden: {}, forces: { repulsion: 1, linkDistance: 1, cluster: 1 } };

function loadGraphSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(GRAPH_KEY) || '{}') || {}; } catch (e) { s = {}; }
  const out = Object.assign({}, GRAPH_DEFAULTS, s);
  out.forces = Object.assign({}, GRAPH_DEFAULTS.forces, s.forces || {});
  out.hidden = Object.assign({}, s.hidden || {});
  if (REDUCED_MOTION) out.autoRotate = false;
  return out;
}
function saveGraphSettings() {
  try { localStorage.setItem(GRAPH_KEY, JSON.stringify(gs)); } catch (e) { /* settings are optional */ }
}
let gs = loadGraphSettings();

/* Layout memory so reopening the graph doesn't start from scratch */
const LAYOUT_CACHE = { main: new Map(), mini: new Map() };

/* Deterministic pseudo-random in [-1, 1] from a string */
function hashRand(str, salt) {
  let h = 2166136261 ^ salt;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) / 4294967295) * 2 - 1;
}
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [160, 160, 160];
}
function hexA(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function truncLabel(t) { return t.length > GRAPH_LOOK.labelChars ? t.slice(0, GRAPH_LOOK.labelChars - 1).trimEnd() + '…' : t; }

/* Build the undirected, de-duplicated link graph of all notes */
function buildLinkGraph() {
  const adj = new Map(state.notes.map(n => [n.id, new Set()]));
  const edges = [];
  const seen = new Set();
  for (const n of state.notes) {
    for (const t of outgoingLinks(n)) {
      const m = findByTitle(t);
      if (!m || m.id === n.id) continue;
      const key = n.id < m.id ? n.id + '\u0000' + m.id : m.id + '\u0000' + n.id;
      if (seen.has(key)) continue;      // A→B and B→A are one line
      seen.add(key);
      edges.push([n.id, m.id]);
      adj.get(n.id).add(m.id);
      adj.get(m.id).add(n.id);
    }
  }
  return { adj, edges };
}

class GraphView {
  /* opts: { mini: bool, onOpen: id => {} } */
  constructor(canvas, opts = {}) {
    this.c = canvas;
    this.ctx = canvas.getContext('2d');
    this.mini = !!opts.mini;
    this.onOpen = opts.onOpen || (() => {});
    this.cache = this.mini ? LAYOUT_CACHE.mini : LAYOUT_CACHE.main;
    this.nodes = []; this.edges = []; this.byId = new Map();
    this.hover = null; this.selected = null; this.search = '';
    this.center = null;             // local-graph centre note id
    this.alpha = 1;
    this.w = 300; this.h = 200; this.dpr = 1;
    this.pointers = new Map(); this.drag = null; this.clickTimer = null; this.lastClick = null;
    this.fly = null; this.raf = null; this.dead = false; this.sig = '';
    this.resetCamera(true);

    this.loop = this.loop.bind(this);
    this.h_down = e => this.onDown(e);
    this.h_move = e => this.onMove(e);
    this.h_up = e => this.onUp(e);
    this.h_leave = () => { if (this.hover && !this.drag) { this.hover = null; this.c.title = ''; this.wake(); } };
    this.h_wheel = e => this.onWheel(e);
    this.h_ctx = e => e.preventDefault();
    canvas.addEventListener('pointerdown', this.h_down);
    canvas.addEventListener('pointermove', this.h_move);
    canvas.addEventListener('pointerup', this.h_up);
    canvas.addEventListener('pointercancel', this.h_up);
    canvas.addEventListener('pointerleave', this.h_leave);
    canvas.addEventListener('wheel', this.h_wheel, { passive: false });
    canvas.addEventListener('contextmenu', this.h_ctx);
    this.ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => this.resize()) : null;
  }

  get flat() { return gs.mode === '2d'; }

  attach(host) {
    if (this.ro && this.host) this.ro.unobserve(this.host);
    this.host = host;
    if (this.ro) this.ro.observe(host);
    this.resize();
  }
  destroy() {
    this.dead = true;
    cancelAnimationFrame(this.raf);
    clearTimeout(this.clickTimer);
    if (this.ro) this.ro.disconnect();
    this.saveLayout();
    const c = this.c;
    c.removeEventListener('pointerdown', this.h_down);
    c.removeEventListener('pointermove', this.h_move);
    c.removeEventListener('pointerup', this.h_up);
    c.removeEventListener('pointercancel', this.h_up);
    c.removeEventListener('pointerleave', this.h_leave);
    c.removeEventListener('wheel', this.h_wheel);
    c.removeEventListener('contextmenu', this.h_ctx);
  }
  resize() {
    const host = this.host || this.c.parentElement;
    if (!host) return;
    const r = host.getBoundingClientRect();
    const w = Math.max(120, Math.round(r.width)), h = Math.max(120, Math.round(r.height));
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if (w === this.w && h === this.h && dpr === this.dpr && this.c.width) { this.wake(); return; }
    this.w = w; this.h = h; this.dpr = dpr;
    this.c.width = Math.round(w * dpr); this.c.height = Math.round(h * dpr);
    this.c.style.width = w + 'px'; this.c.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.wake();
  }

  /* ---------- Camera ---------- */
  get defaultDist() { return this.mini ? 520 : 900; }
  get focal() { return Math.min(this.w, this.h) * (this.mini ? 1.0 : 0.95); }
  resetCamera(silent) {
    this.cam = { yaw: this.flat ? 0 : 0.55, pitch: this.flat ? 0 : -0.3, dist: this.defaultDist, tx: 0, ty: 0, tz: 0 };
    this.fly = null;
    this.userMoved = false;          // until the user moves the camera, it keeps the graph framed
    if (this.nodes && this.nodes.length) this.fitView();
    if (!silent) { this.selected = null; this.wake(); }
  }
  /* Frame all visible nodes: centre on them and pull back far enough to fit */
  fitView() {
    const N = this.nodes;
    if (!N.length || !this.w) return;
    let cx = 0, cy = 0, cz = 0;
    N.forEach(n => { cx += n.x; cy += n.y; cz += n.z; });
    cx /= N.length; cy /= N.length; cz /= N.length;
    let r = 0;
    N.forEach(n => { r = Math.max(r, Math.hypot(n.x - cx, n.y - cy, this.flat ? 0 : n.z - cz)); });
    r = Math.max(r, this.mini ? 30 : 80);
    this.cam.tx = cx; this.cam.ty = cy; this.cam.tz = this.flat ? 0 : cz;
    // the outermost node lands about 44% (mini 40%) of the shorter side from the centre
    this.cam.dist = Math.max(120, Math.min(4000, r * this.focal / (Math.min(this.w, this.h) * (this.mini ? 0.40 : 0.44)) + (this.flat ? 0 : r * 0.3)));
  }
  /* world → screen. Returns { x, y, s (scale), z (depth) } or null when behind the camera */
  project(px, py, pz) {
    const cam = this.cam;
    let x = px - cam.tx, y = py - cam.ty, z = (this.flat ? 0 : pz) - cam.tz;
    if (!this.flat) {
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      x = x1; y = y2; z = z2;
    } else z = 0;
    const zc = z + cam.dist;
    if (zc < 30) return null;
    const s = this.focal / zc;
    return { x: this.w / 2 + x * s, y: this.h / 2 + y * s, s, z: zc };
  }
  /* screen delta (px) at scale s → world delta (inverse camera rotation) */
  unproject(dx, dy, s) {
    const cam = this.cam;
    let x = dx / s, y = dy / s, z = 0;
    if (!this.flat) {
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const y1 = y * cp + z * sp, z1 = -y * sp + z * cp;
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      const x2 = x * cy + z1 * sy, z2 = -x * sy + z1 * cy;
      return [x2, y1, z2];
    }
    return [x, y, 0];
  }

  /* ---------- Data ---------- */
  /* opts: { local: bool, center: id, depth: 1|2 } */
  setData(opts = {}) {
    const { adj, edges } = buildLinkGraph();
    const folders = allFolders();
    // Folder cluster centres: on a sphere (3D) or a circle (2D)
    this.clusters = new Map();
    folders.forEach((f, i) => {
      const n = folders.length;
      const R = FORCE.clusterRadius * (this.mini ? 0.5 : 1);
      if (this.flat) {
        const a = (i / n) * Math.PI * 2;
        this.clusters.set(f, [Math.cos(a) * R, Math.sin(a) * R, 0]);
      } else {                         // Fibonacci sphere
        const y = 1 - (i + 0.5) / n * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996;
        this.clusters.set(f, [Math.cos(th) * r * R, y * R, Math.sin(th) * r * R]);
      }
    });

    let keep = new Set(state.notes.filter(n => !gs.hidden[n.folder || 'Unfiled']).map(n => n.id));
    this.center = null;
    if (opts.local && opts.center && adj.has(opts.center)) {
      this.center = opts.center;
      const near = new Set([opts.center]);
      let frontier = [opts.center];
      for (let d = 0; d < (opts.depth || 1); d++) {
        const next = [];
        frontier.forEach(id => adj.get(id).forEach(m => { if (!near.has(m)) { near.add(m); next.push(m); } }));
        frontier = next;
      }
      keep = new Set([...near].filter(id => keep.has(id) || id === opts.center));
    }

    const old = this.byId;
    let cached = 0;
    this.nodes = state.notes.filter(n => keep.has(n.id)).map(n => {
      const folder = n.folder || 'Unfiled';
      const deg = adj.get(n.id).size;
      const prev = old.get(n.id) || this.cache.get(n.id);
      const cc = this.clusters.get(folder) || [0, 0, 0];
      if (prev) cached++;
      return {
        id: n.id, title: n.title, label: truncLabel(n.title), folder, color: folderColor(folder), deg,
        hub: deg > GRAPH_LOOK.hubThreshold,
        x: prev ? prev.x : cc[0] + hashRand(n.id, 1) * 70,
        y: prev ? prev.y : cc[1] + hashRand(n.id, 2) * 70,
        z: this.flat ? 0 : (prev && prev.z ? prev.z : cc[2] + hashRand(n.id, 3) * 70),
        vx: 0, vy: 0, vz: 0, pinned: prev ? !!prev.pinned : false, p: null
      };
    });
    this.byId = new Map(this.nodes.map(n => [n.id, n]));
    this.edges = edges.filter(([a, b]) => this.byId.has(a) && this.byId.has(b)).map(([a, b]) => {
      const A = this.byId.get(a), B = this.byId.get(b);
      return { a: A, b: B, hub: A.hub || B.hub, same: A.folder === B.folder };
    });
    this.nbr = new Map(this.nodes.map(n => [n.id, new Set()]));
    this.edges.forEach(e => { this.nbr.get(e.a.id).add(e.b.id); this.nbr.get(e.b.id).add(e.a.id); });
    this.topIds = new Set([...this.nodes].sort((a, b) => b.deg - a.deg).slice(0, GRAPH_LOOK.topLabels).map(n => n.id));
    this.rank = new Map([...this.nodes].sort((a, b) => b.deg - a.deg).map((n, i) => [n.id, i]));
    if (this.hover && !this.byId.has(this.hover.id)) this.hover = null;
    if (this.selected) this.selected = this.byId.get(this.selected.id) || null;
    this.alpha = this.nodes.length && cached === this.nodes.length ? 0.15 : 1;
    this.sig = this.nodes.map(n => n.id).join('|') + '#' + this.edges.length + '#' + gs.mode;
    this.wake();
  }
  saveLayout() { this.nodes.forEach(n => this.cache.set(n.id, { x: n.x, y: n.y, z: n.z, pinned: n.pinned })); }
  relayout() {
    this.cache.clear();
    this.nodes.forEach(n => {
      const cc = this.clusters.get(n.folder) || [0, 0, 0];
      n.x = cc[0] + hashRand(n.id + Math.random(), 1) * 90; n.y = cc[1] + hashRand(n.id + Math.random(), 2) * 90;
      n.z = this.flat ? 0 : cc[2] + hashRand(n.id + Math.random(), 3) * 90;
      n.vx = n.vy = n.vz = 0; n.pinned = false;
    });
    this.alpha = 1; this.wake();
  }

  /* ---------- Simulation (one tick) ---------- */
  step() {
    const N = this.nodes, flat = this.flat, f = gs.forces, a = this.alpha;
    const rep = FORCE.repulsion * f.repulsion * (this.mini ? 0.5 : 1);
    const L = FORCE.linkDistance * f.linkDistance * (this.mini ? 0.75 : 1);
    const cl = FORCE.cluster * f.cluster;
    for (const n of N) { n.fx = 0; n.fy = 0; n.fz = 0; }
    // repulsion (O(n²) is fine for a few hundred notes)
    for (let i = 0; i < N.length; i++) {
      const A = N[i];
      for (let j = i + 1; j < N.length; j++) {
        const B = N[j];
        const dx = A.x - B.x, dy = A.y - B.y, dz = flat ? 0 : A.z - B.z;
        const d2 = dx * dx + dy * dy + dz * dz + 25;
        if (d2 > 360000) continue;            // ignore pairs more than 600 apart
        const d = Math.sqrt(d2), k = rep / d2 / d;
        A.fx += dx * k; A.fy += dy * k; A.fz += dz * k;
        B.fx -= dx * k; B.fy -= dy * k; B.fz -= dz * k;
      }
    }
    // springs along links
    for (const e of this.edges) {
      const A = e.a, B = e.b;
      const dx = B.x - A.x, dy = B.y - A.y, dz = flat ? 0 : B.z - A.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      const rest = L * (e.same ? FORCE.sameGroupLink : 1);
      const k = FORCE.spring * (gs.tidy && e.hub ? FORCE.hubSpring : 1) * (d - rest) / d;
      A.fx += dx * k; A.fy += dy * k; A.fz += dz * k;
      B.fx -= dx * k; B.fy -= dy * k; B.fz -= dz * k;
    }
    // centre + folder-cluster pull, then integrate
    for (const n of N) {
      const cc = this.clusters.get(n.folder) || [0, 0, 0];
      n.fx += -n.x * FORCE.center + (cc[0] - n.x) * cl;
      n.fy += -n.y * FORCE.center + (cc[1] - n.y) * cl;
      n.fz += -n.z * FORCE.center + (cc[2] - n.z) * cl;
      if (n.pinned) { n.vx = n.vy = n.vz = 0; continue; }
      n.vx = (n.vx + n.fx * a) * FORCE.damping;
      n.vy = (n.vy + n.fy * a) * FORCE.damping;
      n.vz = flat ? 0 : (n.vz + n.fz * a) * FORCE.damping;
      const sp = Math.hypot(n.vx, n.vy, n.vz);
      if (sp > FORCE.maxSpeed) { const k = FORCE.maxSpeed / sp; n.vx *= k; n.vy *= k; n.vz *= k; }
      n.x += n.vx; n.y += n.vy; n.z = flat ? 0 : n.z + n.vz;
    }
    this.alpha *= FORCE.cooling;
    if (this.alpha < FORCE.minAlpha) { this.alpha = 0; this.saveLayout(); }
  }

  /* ---------- Loop: runs only while something is changing ---------- */
  wake() { if (!this.raf && !this.dead) this.raf = requestAnimationFrame(this.loop); }
  rotating() { return !this.mini && !this.flat && gs.autoRotate && !this.hover && !this.drag && !this.pointers.size && !this.fly && !document.hidden; }
  loop(t) {
    this.raf = null;
    if (this.dead) return;
    if (this.alpha > 0) this.step();
    if (this.fly) {
      const k = Math.min(1, (t - this.fly.t0) / this.fly.ms), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const f = this.fly, c = this.cam;
      c.tx = f.from[0] + (f.to[0] - f.from[0]) * e; c.ty = f.from[1] + (f.to[1] - f.from[1]) * e;
      c.tz = f.from[2] + (f.to[2] - f.from[2]) * e; c.dist = f.from[3] + (f.to[3] - f.from[3]) * e;
      if (k >= 1) this.fly = null;
    }
    if (this.rotating()) this.cam.yaw += GRAPH_LOOK.autoRotateSpeed;
    if (this.alpha > 0 && !this.userMoved && !this.fly) this.fitView();
    this.draw();
    if (this.alpha > 0 || this.fly || this.rotating()) this.wake();
  }

  /* ---------- Drawing ---------- */
  focusNode() { return this.hover || this.selected; }
  draw() {
    const ctx = this.ctx, w = this.w, h = this.h;
    ctx.clearRect(0, 0, w, h);
    if (!this.nodes.length) {
      ctx.fillStyle = 'rgba(154,154,154,.9)'; ctx.font = GRAPH_LOOK.font; ctx.textAlign = 'center';
      ctx.fillText(this.mini ? 'No links yet' : 'No notes to show — check the hidden groups or Local mode.', w / 2, h / 2);
      return;
    }
    // project
    let zMin = Infinity, zMax = -Infinity;
    for (const n of this.nodes) {
      n.p = this.project(n.x, n.y, n.z);
      if (n.p) { zMin = Math.min(zMin, n.p.z); zMax = Math.max(zMax, n.p.z); }
    }
    const zr = Math.max(1, zMax - zMin);
    const depthT = n => this.flat ? 0 : (n.p.z - zMin) / zr;           // 0 = nearest, 1 = farthest
    const fade = n => this.flat ? 1 : 1 - depthT(n) * 0.55;
    const sRef = this.focal / this.defaultDist;
    const zoom = this.focal / this.cam.dist / sRef;                       // 1 = default zoom

    const focus = this.focusNode();
    const nb = focus ? this.nbr.get(focus.id) : null;
    const q = this.search.trim().toLowerCase();
    const match = q ? new Set(this.nodes.filter(n => n.title.toLowerCase().includes(q)).map(n => n.id)) : null;
    const lit = n => (!focus || n === focus || nb.has(n.id)) && (!match || match.has(n.id));
    const dimming = !!(focus || match);

    // edges (thin, faint; highlighted when touching the focus)
    ctx.lineCap = 'round';
    for (const e of this.edges) {
      const A = e.a, B = e.b;
      if (!A.p || !B.p) continue;
      const touches = focus && (A === focus || B === focus);
      if (gs.tidy && e.hub && !touches) continue;                       // Tidy mode hides hub spokes
      let al = GRAPH_LOOK.edgeAlpha * Math.min(fade(A), fade(B));
      let col = GRAPH_LOOK.edgeRGB, lw = this.mini ? 0.8 : 0.9;
      if (touches) { al = 0.85; lw = 1.6; const [r, g, b] = hexToRgb(focus.color); col = `${r},${g},${b}`; }
      else if (dimming) al *= GRAPH_LOOK.dimAlpha / GRAPH_LOOK.edgeAlpha * 0.6;
      if (match && !touches && !(match.has(A.id) && match.has(B.id))) al = Math.min(al, 0.04);
      ctx.strokeStyle = `rgba(${col},${al.toFixed(3)})`;
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(A.p.x, A.p.y); ctx.lineTo(B.p.x, B.p.y); ctx.stroke();
    }

    // nodes, back to front
    const order = this.nodes.filter(n => n.p).sort((a, b) => b.p.z - a.p.z);
    for (const n of order) {
      const base = Math.max(GRAPH_LOOK.nodeMin, Math.min(GRAPH_LOOK.nodeMax, GRAPH_LOOK.nodeMin + Math.sqrt(n.deg) * 1.7)) * (n.hub ? GRAPH_LOOK.hubScale : 1);
      n.r = Math.max(1.5, base * (n.p.s / sRef) * (this.mini ? 0.8 : 1));
      const al = fade(n) * (dimming && !lit(n) ? GRAPH_LOOK.dimAlpha : 1);
      ctx.globalAlpha = al;
      ctx.fillStyle = n.color;
      ctx.beginPath(); ctx.arc(n.p.x, n.p.y, n.r, 0, Math.PI * 2); ctx.fill();
      const ring = n === focus || n.id === state.current || n.id === this.center || n.pinned;
      if (ring) {
        ctx.lineWidth = n === focus ? 2 : 1.4;
        ctx.strokeStyle = n === focus || n.id === this.center ? '#ffffff' : n.pinned ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(n.p.x, n.p.y, n.r + 2.5, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    this.drawLabels(order, { focus, nb, match, zoom, depthT, fade, lit, dimming });
  }

  /* Labels: only the important ones, no overlaps */
  drawLabels(order, o) {
    const ctx = this.ctx;
    const extra = this.mini ? Infinity : o.zoom > 2.6 ? Infinity : o.zoom > 1.15 ? Math.round((o.zoom - 1) * 35) : 0;
    const cands = [];
    for (const n of order) {
      let pr = 0;
      if (n === this.hover) pr = 5;
      else if (n === this.selected || n.id === this.center) pr = 4;
      else if (o.nb && o.nb.has(n.id)) pr = 3;
      else if (o.match && o.match.has(n.id)) pr = 2.5;
      else if (this.topIds.has(n.id) || this.rank.get(n.id) < GRAPH_LOOK.topLabels + extra) pr = 1 + Math.min(0.9, n.deg / 50);
      if (!pr) continue;
      if (o.dimming && !o.lit(n) && pr < 3) continue;
      if (!this.flat && pr < 3 && o.depthT(n) > 0.7) continue;          // skip labels at the back
      cands.push({ n, pr: pr + n.deg / 1000 });
    }
    cands.sort((a, b) => b.pr - a.pr);
    ctx.font = this.mini ? GRAPH_LOOK.miniFont : GRAPH_LOOK.font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const placed = [];
    const lh = this.mini ? 13 : 15;
    for (const { n, pr } of cands) {
      const tw = ctx.measureText(n.label).width;
      const x = n.p.x, y = n.p.y + n.r + 4;
      const box = [x - tw / 2 - 3, y - 1, x + tw / 2 + 3, y + lh];
      if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;  // collision: keep the more important one
      placed.push(box);
      const al = pr >= 3 ? 1 : o.fade(n);
      ctx.globalAlpha = al;
      ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(24,24,24,.92)';                         // dark outline keeps text readable over lines
      ctx.strokeText(n.label, x, y);
      ctx.fillStyle = pr >= 3 ? '#ffffff' : '#c8c8c8';
      ctx.fillText(n.label, x, y);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Interaction ---------- */
  pos(e) { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  pick(x, y) {
    let best = null, bestZ = Infinity;
    for (const n of this.nodes) {
      if (!n.p) continue;
      const d = Math.hypot(n.p.x - x, n.p.y - y);
      if (d <= (n.r || 4) + 5 && n.p.z < bestZ) { best = n; bestZ = n.p.z; }
    }
    return best;
  }
  onDown(e) {
    const [x, y] = this.pos(e);
    try { this.c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    this.pointers.set(e.pointerId, { x, y });
    this.fly = null;
    if (this.pointers.size === 2) {                                     // pinch
      const [a, b] = [...this.pointers.values()];
      this.drag = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, dist0: this.cam.dist, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: true };
      return;
    }
    const hit = this.pick(x, y);
    let mode = 'rotate';
    if (hit && e.button === 0 && !e.shiftKey) mode = 'node';
    else if (e.button === 2 || e.button === 1 || e.shiftKey || this.flat) mode = 'pan';
    this.drag = { mode, node: hit, x0: x, y0: y, x, y, moved: false };
    this.wake();
  }
  onMove(e) {
    const [x, y] = this.pos(e);
    if (!this.pointers.has(e.pointerId)) {                              // plain hover (mouse)
      if (e.pointerType === 'touch') return;
      const hit = this.pick(x, y);
      if (hit !== this.hover) { this.hover = hit; this.c.title = hit ? hit.title : ''; this.c.style.cursor = hit ? 'pointer' : ''; this.wake(); }
      return;
    }
    this.pointers.set(e.pointerId, { x, y });
    const d = this.drag;
    if (!d) return;
    if (d.mode === 'pinch') {
      if (this.pointers.size < 2) return;
      const [a, b] = [...this.pointers.values()];
      const dd = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      this.cam.dist = Math.max(140, Math.min(4000, d.dist0 * d.d0 / dd));
      this.userMoved = true;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      this.panBy(mx - d.mx, my - d.my); d.mx = mx; d.my = my;
      this.wake();
      return;
    }
    const dx = x - d.x, dy = y - d.y;
    d.x = x; d.y = y;
    if (!d.moved && Math.hypot(x - d.x0, y - d.y0) > 4) d.moved = true;
    if (!d.moved) return;
    if (d.mode !== 'node') this.userMoved = true;
    if (d.mode === 'rotate') {
      this.cam.yaw += dx * 0.006;
      this.cam.pitch = Math.max(-1.45, Math.min(1.45, this.cam.pitch + dy * 0.006));
    } else if (d.mode === 'pan') {
      this.panBy(dx, dy);
    } else if (d.mode === 'node' && d.node && d.node.p) {
      const [wx, wy, wz] = this.unproject(dx, dy, d.node.p.s);
      const n = d.node;
      n.x += wx; n.y += wy; n.z = this.flat ? 0 : n.z + wz;
      n.pinned = true;                                                    // dragging pins the node
      this.alpha = Math.max(this.alpha, 0.25);                            // …and wakes the simulation briefly
    }
    this.wake();
  }
  panBy(dx, dy) {
    const s = this.focal / this.cam.dist;
    const [wx, wy, wz] = this.unproject(dx, dy, s);
    this.cam.tx -= wx; this.cam.ty -= wy; this.cam.tz -= wz;
  }
  onUp(e) {
    this.pointers.delete(e.pointerId);
    const d = this.drag;
    if (this.pointers.size) return;
    this.drag = null;
    if (!d) return;
    if (d.mode === 'pinch' || d.moved) { this.wake(); return; }
    const hit = this.pick(d.x0, d.y0);
    if (!hit) { if (this.selected) { this.selected = null; this.wake(); } return; }
    // single click opens the note; a second click within 300 ms flies to it instead
    if (this.lastClick && this.lastClick.id === hit.id && e.timeStamp - this.lastClick.t < 300) {
      clearTimeout(this.clickTimer); this.lastClick = null;
      this.flyTo(hit);
      return;
    }
    this.lastClick = { id: hit.id, t: e.timeStamp };
    clearTimeout(this.clickTimer);
    this.clickTimer = setTimeout(() => { this.lastClick = null; if (!this.dead) this.onOpen(hit.id); }, 300);
  }
  onWheel(e) {
    e.preventDefault();
    const k = Math.exp((e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY) * 0.0012);
    this.cam.dist = Math.max(140, Math.min(4000, this.cam.dist * k));
    this.fly = null;
    this.userMoved = true;
    this.wake();
  }
  flyTo(n) {
    this.selected = n;
    this.userMoved = true;
    const to = [n.x, n.y, this.flat ? 0 : n.z, Math.max(220, this.defaultDist * 0.45)];
    if (REDUCED_MOTION) { [this.cam.tx, this.cam.ty, this.cam.tz, this.cam.dist] = to; this.wake(); return; }
    this.fly = { from: [this.cam.tx, this.cam.ty, this.cam.tz, this.cam.dist], to, t0: performance.now(), ms: 650 };
    this.wake();
  }
}

/* ---------- Full graph view ---------- */
let mainGraph = null;
function graphCenterId() { return getNote(state.current) ? state.current : homeId(); }
function renderGraph() {
  const folders = allFolders();
  view.innerHTML = `<div class="graph-wrap">
    <canvas id="graphCanvas" aria-label="Graph of notes and links. Use the note list for keyboard navigation."></canvas>
    <div class="g-bar">
      <div class="g-seg" role="group" aria-label="2D or 3D">
        <button type="button" class="btn${gs.mode === '2d' ? ' on' : ''}" data-g="2d">2D</button><button type="button" class="btn${gs.mode === '3d' ? ' on' : ''}" data-g="3d">3D</button>
      </div>
      <button type="button" class="btn${gs.autoRotate ? ' on' : ''}" data-g="rotate"${gs.mode === '2d' ? ' disabled' : ''} title="Slowly rotate when idle">Auto-rotate</button>
      <button type="button" class="btn${gs.tidy ? ' on' : ''}" data-g="tidy" title="Hide hub-to-everything links unless the hub is hovered or selected">Tidy</button>
      <button type="button" class="btn${gs.local ? ' on' : ''}" data-g="local" title="Only the current note and its neighbours">Local</button>
      <label class="g-depth"${gs.local ? '' : ' hidden'}>Depth <input type="range" id="gDepth" min="1" max="2" step="1" value="${gs.depth}"> <span id="gDepthVal">${gs.depth}</span></label>
      <button type="button" class="btn" data-g="reset">Reset view</button>
      <input type="search" id="gSearch" class="inp" placeholder="Find in graph…" autocomplete="off">
    </div>
    <details class="g-legend"${window.innerWidth > 760 ? ' open' : ''}><summary>Groups</summary>
      ${folders.map(f => `<button type="button" class="g-group${gs.hidden[f] ? ' off' : ''}" data-g-group="${esc(f)}" title="${gs.hidden[f] ? 'Show' : 'Hide'} ${esc(f)}"><span class="dot" style="background:${folderColor(f)}"></span>${esc(f)}</button>`).join('')}
    </details>
    <details class="g-forces"${gs.forcesOpen ? ' open' : ''}>
      <summary>Forces</summary>
      ${[['repulsion', 'Repulsion'], ['linkDistance', 'Link distance'], ['cluster', 'Cluster strength']].map(([k, l]) =>
        `<label>${l}<input type="range" min="0.2" max="3" step="0.1" data-g-force="${k}" value="${gs.forces[k]}"><span>${(+gs.forces[k]).toFixed(1)}×</span></label>`).join('')}
      <button type="button" class="btn" data-g="relayout">Re-layout</button>
    </details>
    <div class="g-hint">${gs.mode === '3d' ? 'Drag to rotate · Shift- or right-drag to pan' : 'Drag to pan'} · Scroll or pinch to zoom · Click a dot to open · Double-click to focus</div>
  </div>`;
  const wrap = view.querySelector('.graph-wrap');
  if (mainGraph) mainGraph.destroy();
  mainGraph = new GraphView($('#graphCanvas'), { onOpen: id => open(id) });
  mainGraph.attach(wrap);
  mainGraph.setData({ local: gs.local, center: graphCenterId(), depth: gs.depth });
  if (gs.local) mainGraph.selected = mainGraph.byId.get(graphCenterId()) || null;

  const rebuild = () => { mainGraph.setData({ local: gs.local, center: graphCenterId(), depth: gs.depth }); mainGraph.selected = gs.local ? mainGraph.byId.get(graphCenterId()) || null : mainGraph.selected; };
  wrap.addEventListener('click', e => {
    const b = e.target.closest('[data-g],[data-g-group]');
    if (!b) return;
    if (b.dataset.gGroup) {
      const f = b.dataset.gGroup;
      gs.hidden[f] = !gs.hidden[f];
      if (!gs.hidden[f]) delete gs.hidden[f];
      b.classList.toggle('off', !!gs.hidden[f]);
      saveGraphSettings(); rebuild(); return;
    }
    const k = b.dataset.g;
    if (k === '2d' || k === '3d') {
      if (gs.mode === k) return;
      mainGraph.saveLayout();
      gs.mode = k; saveGraphSettings();
      renderMain(); return;                         // rebuilds the engine with the z-axis flattened (or not)
    }
    if (k === 'rotate') { gs.autoRotate = !gs.autoRotate; b.classList.toggle('on', gs.autoRotate); saveGraphSettings(); mainGraph.wake(); }
    else if (k === 'tidy') { gs.tidy = !gs.tidy; b.classList.toggle('on', gs.tidy); saveGraphSettings(); mainGraph.alpha = Math.max(mainGraph.alpha, 0.3); mainGraph.wake(); }
    else if (k === 'local') { gs.local = !gs.local; b.classList.toggle('on', gs.local); wrap.querySelector('.g-depth').hidden = !gs.local; saveGraphSettings(); rebuild(); renderRight(); }
    else if (k === 'reset') mainGraph.resetCamera();
    else if (k === 'relayout') mainGraph.relayout();
  });
  wrap.querySelector('.g-forces').addEventListener('toggle', e => { gs.forcesOpen = e.target.open; saveGraphSettings(); });
  wrap.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'gSearch') { mainGraph.search = t.value; mainGraph.wake(); }
    else if (t.id === 'gDepth') { gs.depth = +t.value; $('#gDepthVal').textContent = gs.depth; saveGraphSettings(); rebuild(); }
    else if (t.dataset.gForce) {
      gs.forces[t.dataset.gForce] = +t.value;
      t.nextElementSibling.textContent = (+t.value).toFixed(1) + '×';
      saveGraphSettings();
      mainGraph.alpha = Math.max(mainGraph.alpha, 0.5); mainGraph.wake();
    }
  });
}

/* ---------- Local graph panel in the right sidebar ---------- */
let miniGraph = null, miniCanvas = null;
function miniGraphHTML() {
  return `<h3>Local graph</h3><div class="mini-graph" id="miniGraphHost"></div>
    <label class="g-depth mini-depth">Depth <input type="range" id="miniDepth" min="1" max="2" step="1" value="${gs.miniDepth}"> <span>${gs.miniDepth}</span></label>`;
}
function mountMiniGraph(noteId) {
  const host = $('#miniGraphHost');
  if (!host) return;
  if (!miniCanvas) {
    miniCanvas = document.createElement('canvas');
    miniCanvas.className = 'mini-graph-canvas';
    miniCanvas.setAttribute('aria-label', 'Local graph of this note');
  }
  host.appendChild(miniCanvas);
  if (!miniGraph || miniGraph.dead) miniGraph = new GraphView(miniCanvas, { mini: true, onOpen: id => open(id) });
  miniGraph.attach(host);
  // Only rebuild when the note, depth, mode, hidden groups or any link changed
  const key = [noteId, gs.miniDepth, gs.mode, JSON.stringify(gs.hidden),
    state.notes.map(n => n.id + ':' + n.title + ':' + (n.folder || '') + ':' + outgoingLinks(n).join('|')).join('/')].join('#');
  if (miniGraph.key !== key) {
    const prevCenter = miniGraph.center;
    miniGraph.setData({ local: true, center: noteId, depth: gs.miniDepth });
    if (prevCenter !== noteId) miniGraph.resetCamera(true);
    miniGraph.key = key;
  } else miniGraph.wake();
  const slider = $('#miniDepth');
  slider.oninput = () => { gs.miniDepth = +slider.value; slider.nextElementSibling.textContent = gs.miniDepth; saveGraphSettings(); miniGraph.key = null; miniGraph.setData({ local: true, center: noteId, depth: gs.miniDepth }); };
}
function unmountMiniGraph() {
  if (miniGraph) { miniGraph.destroy(); miniGraph = null; }
}

/* ---------- Broken wikilink report (console) ---------- */
function reportBrokenLinks() {
  const broken = [];
  state.notes.forEach(n => outgoingLinks(n).forEach(t => { if (!findByTitle(t)) broken.push(`${n.title} → [[${t}]]`); }));
  if (broken.length) console.warn(`Broken wikilinks (${broken.length}):\n` + broken.join('\n'));
  else console.info('Wikilinks: all resolve.');
  return broken;
}

/* ==========================================================================
   12. EXPORT / BACKUP / IMPORT
   ========================================================================== */
function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function today() { return new Date().toISOString().slice(0, 10); }

/* Replace app-only tokens with readable Markdown (works in Obsidian) */
function exportBody(note) {
  return note.body.replace(TOKEN_RE, (m, kind, args) => {
    const a = args.split('|');
    switch (kind) {
      case 'fact': {
        const src = a.slice(1).join('|').trim();
        return `**[${normStatus(a[0])}]**${src ? ` _(source: ${src})_` : ''}`;
      }
      case 'field': {
        const v = (a[1] || '').trim();
        return `**[${normStatus(a[0])}]** ${v || '________'}`;
      }
      case 'dashboard': {
        const c = countStatuses(scanStatusItems());
        return STATUSES.map(s => `- **${s}:** ${c[s]}`).join('\n');
      }
      case 'status-list': {
        const st = normStatus(a[0]);
        const items = scanStatusItems().filter(i => i.status === st);
        return items.length ? items.map(i => `- [${st}] ${i.note.title}: ${truncate(i.context || i.id || i.heading, 140)}`).join('\n') : `_Nothing marked ${st}._`;
      }
      case 'tasks': {
        const src = findByTitle((a[0] || '').trim());
        return src ? src.body.split('\n').filter(l => /^\s*[-*+]\s+\[( |x|X)\]/.test(l)).join('\n') : '';
      }
      default: return m;
    }
  });
}
function noteToMarkdown(note) {
  return `# ${note.title}\n\n> Folder: ${note.folder || 'Unfiled'} · Type: ${NOTE_TYPES[note.type] || 'Note'}\n\n${exportBody(note)}\n`;
}
function sortedNotes() {
  return state.notes.map((n, i) => ({ n, i }))
    .sort((a, b) => folderRank(a.n.folder) - folderRank(b.n.folder) || String(a.n.folder).localeCompare(String(b.n.folder)) || a.i - b.i)
    .map(x => x.n);
}
function exportMarkdown() {
  const notes = sortedNotes();
  const c = countStatuses(scanStatusItems());
  let out = `# Zambia Debt Burden — Knowledge Base export\n\nExported ${today()} · ${notes.length} notes · ` +
    `VERIFIED ${c['VERIFIED']} · NEEDS CHECK ${c['NEEDS CHECK']} · MISSING ${c['MISSING']}\n\n## Contents\n\n` +
    notes.map(n => `- [[${n.title}]] (${n.folder || 'Unfiled'})`).join('\n') + '\n';
  notes.forEach(n => { out += '\n\n---\n\n' + noteToMarkdown(n); });
  download(`zambia-kb-${today()}.md`, out, 'text/markdown;charset=utf-8');
  toast('Exported all notes as one Markdown file.');
}
function exportCurrentNote() {
  const note = getNote(state.current);
  if (!note) return;
  download(`${slug(note.title) || 'note'}.md`, noteToMarkdown(note), 'text/markdown;charset=utf-8');
}
function backupJSON() {
  download(`zambia-kb-backup-${today()}.json`, JSON.stringify({ app: 'zambia-econ-kb', version: 1, exported: new Date().toISOString(), notes: state.notes }, null, 2), 'application/json');
  toast('Backup downloaded.');
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const notes = Array.isArray(data) ? data : data.notes;
      if (!Array.isArray(notes) || !notes.every(n => n && typeof n.title === 'string' && typeof n.body === 'string')) throw new Error('bad format');
      if (!confirm(`Replace your current ${state.notes.length} notes with ${notes.length} notes from this backup?`)) return;
      state.notes = notes.map(n => ({ id: n.id || uniqueId(n.title), title: n.title, folder: n.folder || 'Unfiled', type: n.type || 'note', body: n.body, aliases: Array.isArray(n.aliases) ? n.aliases : [] }));
      save();
      toast('Backup imported.');
      open(homeId());
    } catch (e) {
      toast('That file is not a valid backup.');
    }
  };
  reader.readAsText(file);
}
function resetAll() {
  if (!confirm('Reset to the original notes? This deletes ALL your edits, statuses and new notes in this browser.\n\nTip: click "Backup JSON" first if you might want them back.')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  state.notes = JSON.parse(JSON.stringify(DEFAULT_NOTES));
  state.collapsed = {};
  save();
  toast('Notes reset.');
  open(homeId());
}

  "My research study report is presented for submission in the MS Word (.docx) format and is free from viruses"
];

/* ---------- Blueprint state (localStorage, every access guarded) ---------- */
const bp = {
  drafts: {}, status: {}, workflow: {}, checks: {}, chips: {}, collapsed: {}, sideCollapsed: {},
  useAim3: true, extraFigures: 0, imports: { project: null, guide: null }
};
let bpFocus = null;

function bpLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(BP_KEY) || 'null');
    if (d && typeof d === 'object') Object.assign(bp, d, { imports: Object.assign({ project: null, guide: null }, d.imports || {}) });
  } catch (e) { /* storage blocked or corrupt: start empty */ }
}
let bpSaveTimer = null, bpSaveWarned = false;
function bpSave(now) {
  clearTimeout(bpSaveTimer);
  const write = () => {
    try { localStorage.setItem(BP_KEY, JSON.stringify(bp)); }
    catch (e) { if (!bpSaveWarned) { toast('Could not save the blueprint in this browser — use "Export drafts" to keep your work.'); bpSaveWarned = true; } }
  };
  if (now) write(); else bpSaveTimer = setTimeout(write, 400);
}

/* ---------- Tree helpers ---------- */
const bpIndex = new Map();          // id -> { node, parent, section, depth }
(function indexBlueprint() {
  const walk = (node, parent, section, depth) => {
    bpIndex.set(node.id, { node, parent, section: section || node, depth });
    (node.children || []).forEach(c => walk(c, node, section || node, depth + 1));
  };
  BLUEPRINT.sections.forEach(s => walk(s, null, null, 0));
})();
const bpIsSlot = n => !n.children;
const bpActive = n => !(n.aim3 && !bp.useAim3);
function bpSlots(node) {
  if (!bpActive(node)) return [];
  if (bpIsSlot(node)) return [node];
  return node.children.flatMap(bpSlots);
}
const bpAllSlots = () => BLUEPRINT.sections.flatMap(bpSlots);
function wordCount(t) { return String(t || '').trim().split(/\s+/).filter(Boolean).length; }
function bpWords(node) {
  return bpSlots(node).filter(s => !s.noCount).reduce((sum, s) => sum + wordCount(bp.drafts[s.id]), 0);
}
function bpTotals() {
  const slots = bpAllSlots();
  return {
    words: BLUEPRINT.sections.reduce((s, sec) => s + bpWords(sec), 0),
    figures: slots.filter(s => s.figure).length + (Math.max(0, parseInt(bp.extraFigures, 10) || 0)),
    done: slots.filter(s => bp.status[s.id] === 'Done').length,
    total: slots.length
  };
}
function bpChipStatus(key, s) { return normStatus(bp.chips[key] || s); }
function bpSearchText(n) {
  const parts = [n.id, n.title, n.heading, ...(n.what || []), ...(n.insert || []), ...(n.hints || []), ...(n.rules || []),
    ...(n.shelf || []).map(c => c.t), ...(n.sources || []).map(c => c.t), bp.drafts[n.id]];
  return parts.filter(Boolean).join(' ').toLowerCase();
}
function bpMatches(n, q) {
  if (!q) return true;
  if (bpSearchText(n).includes(q)) return true;
  return (n.children || []).some(c => bpMatches(c, q));
}

/* ---------- Imported files ---------- */
function bpImportFile(kind, file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('That file is not valid JSON.'); return; }
    if (kind === 'project' && !(data && Array.isArray(data.government_policies))) { toast('That doesn\'t look like zambia_project_data.json (no government_policies list).'); return; }
    if (kind === 'guide' && !(data && Array.isArray(data.sections))) { toast('That doesn\'t look like grinds360_research_guide.json (no sections list).'); return; }
    bp.imports[kind] = data;
    bpSave(true);
    toast(kind === 'project' ? 'Project data imported.' : 'Research guide imported.');
    renderMain(); renderRight();
  };
  reader.readAsText(file);
}
function bpGuideChecklist() {
  const g = bp.imports.guide;
  if (g && Array.isArray(g.sections)) {
    for (const s of g.sections) for (const b of (s.blocks || [])) {
      if (b.type === 'checklist' && Array.isArray(b.items)) return { items: b.items.map(i => typeof i === 'string' ? i : String(i.text || '')).filter(Boolean), from: 'grinds360_research_guide.json' };
    }
  }
  return { items: BP_FALLBACK_CHECKLIST, from: 'the Grinds360 guide (built in)' };
}

/* Small renderers for imported data (values shown exactly as in the file) */
function bpValueHTML(v) {
  if (v == null) return '<span class="muted">—</span>';
  if (typeof v === 'object') {
    return Array.isArray(v) ? esc(v.join('; ')) : Object.entries(v).map(([k, x]) => `${esc(k.replace(/_/g, ' '))}: ${typeof x === 'object' ? esc(JSON.stringify(x)) : esc(x)}`).join(' · ');
  }
  const s = String(v);
  return STATUSES.includes(s.trim()) ? `<span class="badge static ${statusClass(s.trim())}">${esc(s.trim())}</span>` : esc(s);
}
function bpObjList(title, obj) {
  if (!obj || typeof obj !== 'object') return '';
  const status = obj.status ? `<span class="badge static ${statusClass(normStatus(obj.status))}">${esc(normStatus(obj.status))}</span>` : '';
  const rows = Object.entries(obj).filter(([k]) => k !== 'status').map(([k, v]) => `<li><span class="muted">${esc(k.replace(/_/g, ' '))}:</span> ${bpValueHTML(v)}</li>`).join('');
  return `<div class="bp-pulled-block"><div class="bp-pulled-title">${esc(title)} ${status}</div><ul>${rows}</ul></div>`;
}
function bpPulled(n) {
  if (!n.pull) return '';
  const p = bp.imports.project;
  const wrap = (inner, src) => `<div class="bp-pulled"><div class="bp-label">From your imported file <span class="muted">· ${esc(src)}</span></div>${inner}</div>`;
  const need = '<div class="bp-pulled bp-pulled-empty">Import <b>zambia_project_data.json</b> at the top of the blueprint to show this data here.</div>';
  if (!p) return need;
  const ev = p.evidence_of_struggle || {};
  if (n.pull === 'imfDebt') {
    const d = ev.imf_public_debt_pct_gdp;
    if (!d || !d.series) return wrap('<p class="muted">No imf_public_debt_pct_gdp series in the file.</p>', 'evidence_of_struggle');
    const keys = Object.keys(d.series);
    const years = keys.map(k => k.replace(/_projection$/, ''));
    const firstProj = keys.find(k => /_projection$/.test(k));
    const raw = `title: Public debt (% of GDP)\nyears: ${years.join(', ')}\n` + (firstProj ? `projection-from: ${firstProj.replace(/_projection$/, '')}\n` : '') +
      `unit: % of GDP\nseries: Public debt (% of GDP) | ${keys.map(k => d.series[k]).join(', ')}\nsource: ${d.source || 'imported file'}`;
    return wrap(renderChart(raw) + (d.status ? `<p>Status in file: <span class="badge static ${statusClass(normStatus(d.status))}">${esc(normStatus(d.status))}</span></p>` : ''), 'evidence_of_struggle.imf_public_debt_pct_gdp');
  }
  if (n.pull === 'policies') {
    const rows = p.government_policies.map(x => `<tr><td><b>${esc(x.id || '')}</b> ${esc(x.name || '')}<div class="muted">${esc(x.actor || '')}</div></td>` +
      `<td>${bpValueHTML(x.date)}${x.date_status ? ` <span class="badge static ${statusClass(normStatus(x.date_status))}">${esc(normStatus(x.date_status))}</span>` : ''}</td>` +
      `<td>${bpValueHTML(x.what_it_promised)}</td><td>${bpValueHTML(x.result_data)}</td><td>${bpValueHTML(x.judgement)}</td>` +
      `<td>${x.status ? `<span class="badge static ${statusClass(normStatus(x.status))}">${esc(normStatus(x.status))}</span>` : ''}</td></tr>`).join('');
    return wrap(`<div class="table-wrap"><table><thead><tr><th>Policy</th><th>Date</th><th>What it promised</th><th>Result with data</th><th>Judgement</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`, 'government_policies');
  }
  if (n.pull === 'outcomes') {
    return wrap(bpObjList('Inflation', ev.inflation_trading_economics) + bpObjList('Interest rates', ev.interest_rates_trading_economics) + bpObjList('Currency', ev.currency_trading_economics) || '<p class="muted">No outcome data in the file.</p>', 'evidence_of_struggle');
  }
  if (n.pull === 'impact') {
    return wrap(bpObjList('Budget balance (% of GDP)', ev.budget_balance_pct_gdp_trading_economics) + bpObjList('Unemployment', ev.unemployment_trading_economics) + bpObjList('Growth', ev.growth) || '<p class="muted">No impact data in the file.</p>', 'evidence_of_struggle');
  }
  return '';
}

/* ---------- Main blueprint view ---------- */
function bpCountLabel(n) {
  const w = bpWords(n);
  if (n.noCount) return `${wordCount(bp.drafts[n.id])} words · not counted`;
  if (n.budget) return `${w} / ${n.budget} words`;
  const parent = bpIndex.get(n.id).parent;
  return parent && parent.budget ? `${w} words · counts toward ${parent.id}` : `${w} words`;
}
function bpOver(n) { return n.budget && bpWords(n) > n.budget; }

function bpChipsHTML(n) {
  let html = '';
  if (n.shelf && n.shelf.length) {
    html += '<div class="bp-label">Data shelf</div><div class="bp-chips">' + n.shelf.map((c, i) => {
      const key = n.id + ':' + i, s = bpChipStatus(key, c.s);
      return `<span class="bp-chip"><button type="button" class="badge ${statusClass(s)}" data-bp-chip="${esc(key)}" title="Click to change status">${s}</button>${esc(c.t)}</span>`;
    }).join('') + '</div>';
  }
  if (n.sources && n.sources.length) {
    html += '<div class="bp-label">Source shelf</div><div class="bp-chips">' + n.sources.map(c => {
      const cls = c.k === 'Quantitative' ? 'k-quant' : c.k === 'Qualitative' ? 'k-qual' : 'k-caution';
      return `<span class="bp-chip"><span class="kind ${cls}">${esc(c.k)}</span>${esc(c.t)}</span>`;
    }).join('') + '</div>';
  }
  return html;
}
function bpInsertsHTML(n, list) {
  if (!list || !list.length) return '';
  return `<div class="bp-label">Insert</div><div class="bp-inserts">` + list.map(t =>
    `<button type="button" class="bp-insert" data-bp-ins="${esc(n.id)}" data-text="${esc('[INSERT: ' + t + ']')}" title="Add this placeholder to your draft">[INSERT: ${esc(t)}]</button>`).join('') + '</div>';
}
function bpRulesHTML(rules) {
  return rules && rules.length ? `<div class="bp-rules"><b>Rules</b><ul>${rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : '';
}
function bpProgressHTML(n) {
  if (!n.budget) return `<div class="bp-progress"><span class="bp-count" data-bp-count="${esc(n.id)}">${bpCountLabel(n)}</span></div>`;
  const w = bpWords(n), pct = Math.min(100, (w / n.budget) * 100);
  return `<div class="bp-progress"><div class="bp-bar"><span data-bp-bar="${esc(n.id)}" class="${bpOver(n) ? 'over' : ''}" style="width:${pct.toFixed(1)}%"></span></div>` +
    `<span class="bp-count${bpOver(n) ? ' over' : ''}" data-bp-count="${esc(n.id)}">${bpCountLabel(n)}</span></div>`;
}

function bpSpecialHTML(n) {
  if (n.special === 'figures') {
    const t = bpTotals();
    const figs = BLUEPRINT.sections.flatMap(s => { const out = []; const walk = x => { if (x.figure) out.push(x); (x.children || []).forEach(walk); }; walk(s); return out; });
    return `<ul class="bp-figlist">${figs.map(f => `<li class="${bpActive(f) && bpActive(bpIndex.get(f.id).parent || f) ? '' : 'off'}"><b>Figure ${f.figure}</b> · ${esc(f.title.replace(/^Figure \d+[^:]*:\s*/, ''))} <a href="#blueprint/${esc(f.id)}" class="bp-goto" data-bp-goto="${esc(f.id)}">${esc(f.id)}</a>${bpActive(f) && bpActive(bpIndex.get(f.id).parent || f) ? '' : ' <span class="muted">(Aim 3 off)</span>'}</li>`).join('')}</ul>` +
      `<label class="bp-inline">Other tables, images or photos I plan: <input type="number" min="0" max="20" class="inp bp-extra" id="bpExtraFigures" value="${esc(bp.extraFigures || 0)}"></label>` +
      `<p class="bp-figtotal${t.figures > BP_MAX_FIGURES ? ' over' : ''}" data-bp-figtotal>${t.figures} / ${BP_MAX_FIGURES} figures planned${t.figures > BP_MAX_FIGURES ? ' — over the limit of 10' : ''}</p>`;
  }
  if (n.special === 'presentation') return bpCheckList('pres', BLUEPRINT.presentation);
  if (n.special === 'checklist') { const c = bpGuideChecklist(); return `<p class="muted">From ${esc(c.from)}.</p>` + bpCheckList('final', c.items); }
  return '';
}
function bpCheckList(prefix, items) {
  const done = items.filter(t => bp.checks[prefix + ':' + t]).length;
  return `<div class="task-progress">${done} of ${items.length} done</div><ul class="task-list">` + items.map(t => {
    const key = prefix + ':' + t, on = !!bp.checks[key];
    return `<li class="task-item"><label class="task${on ? ' done' : ''}"><input type="checkbox" data-bp-check="${esc(key)}"${on ? ' checked' : ''}><span>${esc(t)}</span></label></li>`;
  }).join('') + '</ul>';
}

function bpSlotHTML(n) {
  const st = bp.status[n.id] || 'Not started';
  const sec = bpIndex.get(n.id).section;
  const off = !bpActive(n);
  return `<article class="bp-slot st-${st.replace(/\s/g, '-').toLowerCase()}${off ? ' off' : ''}" id="bp-${esc(n.id)}" data-bp-slot="${esc(n.id)}">

      <span class="bp-id">${esc(n.id)}</span><h4>${esc(n.title)}</h4>
      ${n.special ? '' : `<span class="bp-count${bpOver(n) ? ' over' : ''}" data-bp-count="${esc(n.id)}">${bpCountLabel(n)}</span>`}
      <select class="inp bp-status" data-bp-status="${esc(n.id)}" aria-label="Status of ${esc(n.id)}">${BP_STATUSES.map(s => `<option${s === st ? ' selected' : ''}>${s}</option>`).join('')}</select>
    </header>
    <div class="bp-meta">Marks: ${esc(sec.earns || '—')} <span class="muted">(${esc(sec.title)} section)</span>${n.figure ? ` · <b>Figure ${n.figure}</b>` : ''}</div>
    ${off ? '<p class="muted">Aim 3 is switched off. Turn it on in the project card to use this slot.</p>' : `
    ${n.what ? `<div class="bp-label">What goes here</div><ul class="bp-what">${n.what.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    ${bpInsertsHTML(n, n.insert)}
    ${bpChipsHTML(n)}
    ${n.hints ? `<ul class="bp-hints">${n.hints.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
    ${bpPulled(n)}
    ${bpSpecialHTML(n)}
    ${bpRulesHTML(n.rules)}
    ${n.special ? '' : `<div class="bp-draft">
      <textarea class="inp" data-bp-draft="${esc(n.id)}" id="bpd-${esc(n.id)}" rows="${n.budget && n.budget > 60 ? 6 : 4}" placeholder="Your draft for ${esc(n.id)} — your own words.">${esc(bp.drafts[n.id] || '')}</textarea>
      <div class="bp-draft-foot"><span class="bp-count${bpOver(n) ? ' over' : ''}" data-bp-count2="${esc(n.id)}">${bpCountLabel(n)}</span><button type="button" class="btn" data-bp-copy="${esc(n.id)}">Copy</button></div>
    </div>`}`}
  </article>`;
}

function bpNodeHTML(n) {
  if (bpIsSlot(n)) return bpSlotHTML(n);
  const isSection = bpIndex.get(n.id).depth === 0;
  const collapsed = !!bp.collapsed[n.id];
  const off = !bpActive(n);
  const head = isSection
    ? `<button type="button" class="bp-head bp-sec-head" data-bp-toggle="${esc(n.id)}" aria-expanded="${!collapsed}"><span class="chev"></span><span class="bp-sec-id">${esc(n.id)}</span>${esc(n.title)}${n.budget ? `<span class="bp-budget-tag">${n.budget} words</span>` : '<span class="bp-budget-tag">no word budget</span>'}</button>
       <div class="bp-earns">Earns: ${esc(n.earns || '—')}</div>`
    : `<button type="button" class="bp-head bp-sub-head" data-bp-toggle="${esc(n.id)}" aria-expanded="${!collapsed}"><span class="chev"></span><span class="bp-id">${esc(n.id)}</span>${esc(n.title)}</button>`;
  return `<section class="bp-node ${isSection ? 'bp-section' : 'bp-sub'}${collapsed ? ' collapsed' : ''}${off ? ' off' : ''}" id="bp-${esc(n.id)}" data-bp-node="${esc(n.id)}">
    ${head}
    ${off ? '<p class="muted bp-offnote">Aim 3 is switched off — not counted in words, figures or slots. Turn it back on in the project card.</p>' : (n.budget || !isSection ? bpProgressHTML(n) : '')}
    ${off ? '' : `<div class="bp-children">
      ${n.heading ? bpInsertsHTML(n, [n.heading]) : ''}
      ${n.what ? `<ul class="bp-what">${n.what.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      ${bpRulesHTML(n.rules)}
      ${n.children.map(bpNodeHTML).join('')}
    </div>`}
  </section>`;
}

function bpStickyHTML() {
  const t = bpTotals();
  return `<div class="bp-sticky" id="bpSticky">
    <span class="${t.words > BP_TOTAL_WORDS ? 'over' : ''}" data-bp-total-words><b>${t.words}</b> / ${BP_TOTAL_WORDS} words</span>
    <span class="${t.figures > BP_MAX_FIGURES ? 'over' : ''}" data-bp-total-figs><b>${t.figures}</b> / ${BP_MAX_FIGURES} figures</span>
    <span data-bp-total-done><b>${t.done}</b> / ${t.total} slots done</span>
    <span class="bp-sticky-actions"><button type="button" class="btn" data-bp-act="export">Export drafts</button></span>
  </div>`;
}

      <details class="bp-card bp-workflow" open>

        <ol class="task-list bp-wf">${BLUEPRINT.workflow.map((w, i) => `<li class="task-item"><label class="task${bp.workflow[i] ? ' done' : ''}"><input type="checkbox" data-bp-wf="${i}"${bp.workflow[i] ? ' checked' : ''}><span>${i + 1}. ${esc(w)}</span></label></li>`).join('')}</ol>

/* Update every count, bar and total in place (keeps typing focus) */
function bpUpdateCounts() {
  view.querySelectorAll('[data-bp-count],[data-bp-count2]').forEach(el => {
    const n = bpIndex.get(el.dataset.bpCount || el.dataset.bpCount2);
    if (!n) return;
    el.textContent = bpCountLabel(n.node);
    el.classList.toggle('over', !!bpOver(n.node));
  });
  view.querySelectorAll('[data-bp-bar]').forEach(el => {
    const n = bpIndex.get(el.dataset.bpBar).node;
    el.style.width = Math.min(100, (bpWords(n) / n.budget) * 100).toFixed(1) + '%';
    el.classList.toggle('over', !!bpOver(n));
  });
  const t = bpTotals(), set = (sel, html, over) => { const el = view.querySelector(sel); if (el) { el.innerHTML = html; el.classList.toggle('over', !!over); } };
  set('[data-bp-total-words]', `<b>${t.words}</b> / ${BP_TOTAL_WORDS} words`, t.words > BP_TOTAL_WORDS);
  set('[data-bp-total-figs]', `<b>${t.figures}</b> / ${BP_MAX_FIGURES} figures`, t.figures > BP_MAX_FIGURES);
  set('[data-bp-total-done]', `<b>${t.done}</b> / ${t.total} slots done`);
  set('[data-bp-figtotal]', `${t.figures} / ${BP_MAX_FIGURES} figures planned${t.figures > BP_MAX_FIGURES ? ' — over the limit of 10' : ''}`, t.figures > BP_MAX_FIGURES);
}

/* ---------- Sidebar outline ---------- */
function bpTreeHTML(q) {
  if (state.tag) return '';
  const open = !bp.sideCollapsed.__root || q;
  const row = (n, depth) => {
    if (q && !bpMatches(n, q)) return '';
    const slot = bpIsSlot(n), st = bp.status[n.id] || 'Not started';
    const kids = slot ? '' : n.children.map(c => row(c, depth + 1)).join('');
    const closed = !slot && bp.sideCollapsed[n.id] && !q;
    return `<div class="bp-trow${bpActive(n) ? '' : ' off'}">` +
      `<a href="#blueprint/${esc(n.id)}" class="bp-tlink" data-bp-goto="${esc(n.id)}" style="padding-left:${12 + depth * 13}px">` +
      (slot ? `<span class="bp-dot st-${st.replace(/\s/g, '-').toLowerCase()}" title="${esc(st)}"></span>` :
        `<span class="chev bp-tchev${closed ? ' closed' : ''}" data-bp-side="${esc(n.id)}" title="Collapse"></span>`) +
      `<b>${esc(n.id)}</b> ${esc(n.title)}</a>` + (closed ? '' : kids) + '</div>';
  };
  const t = bpTotals();
  return `<div class="folder bp-tree${open ? '' : ' collapsed'}">` +
    `<button class="folder-head" data-bp-side="__root" aria-expanded="${!!open}"><span class="chev"></span>Project Blueprint<span class="count">${t.done}/${t.total}</span></button>` +
    `<div class="folder-notes"><a href="#blueprint" class="bp-tlink bp-tlink-top${state.mode === 'blueprint' ? ' active' : ''}" data-bp-goto="">◆ Open the blueprint</a>` +
    BLUEPRINT.sections.map(s => row(s, 0)).join('') + '</div></div>';
}

function bpRightHTML() {
  const t = bpTotals();
  return '<h3>Project Blueprint</h3><p class="muted">A scaffold for the report. Click an [INSERT] box to add that placeholder to the draft, then replace it with your own words.</p>' +
    '<h3>Words by section</h3><ul class="rlist">' + BLUEPRINT.sections.filter(s => s.budget).map(s =>
      `<li><a href="#blueprint/${esc(s.id)}" data-bp-goto="${esc(s.id)}">${esc(s.id)} ${esc(s.title)}</a><span class="snip${bpOver(s) ? ' over' : ''}">${bpWords(s)} / ${s.budget} words</span></li>`).join('') + '</ul>' +
    `<h3>Totals</h3><div class="mini-stats"><div><b>${t.words}</b>of ${BP_TOTAL_WORDS} words</div><div><b>${t.figures}</b>of ${BP_MAX_FIGURES} figures</div><div><b>${t.done}</b>of ${t.total} slots</div></div>` +
    `<h3>Data files</h3><p class="muted">Project data: ${bp.imports.project ? 'imported' : 'not imported'}<br>Research guide: ${bp.imports.guide ? 'imported' : 'not imported'}</p>`;
}

/* ---------- Export drafts (.md in report order) ---------- */
function bpExportDrafts() {
  const t = bpTotals();
  let out = `# Zambia debt burden — report drafts\n\nExported ${today()} · ${t.words} / ${BP_TOTAL_WORDS} words · ${t.done} / ${t.total} slots done\n`;
  const walk = (n, level) => {
    if (!bpActive(n)) return;
    const h = '#'.repeat(Math.min(6, level));
    if (bpIsSlot(n)) {
      if (n.special) return;
      const d = (bp.drafts[n.id] || '').trim();
      out += `\n${h} ${n.id} ${n.title}\n\n${d || '_(not drafted yet)_'}\n`;
    } else {
      out += `\n${h} ${level === 2 ? n.id + '. ' : n.id + ' '}${n.title}\n`;
      n.children.forEach(c => walk(c, level + 1));
    }
  };
  BLUEPRINT.sections.forEach(s => walk(s, 2));
  download(`zambia-report-drafts-${today()}.md`, out, 'text/markdown;charset=utf-8');
  toast('Drafts exported.');
}

/* ---------- Copy a draft ---------- */
function bpCopy(id) {
  const text = bp.drafts[id] || '';
  if (!text.trim()) { toast('This draft is empty.'); return; }
  const fallback = () => {
    const ta = document.getElementById('bpd-' + id);
    if (!ta) return;
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    toast(ok ? 'Copied.' : 'Text selected — press Ctrl+C to copy.');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied.'), fallback); } catch (e) { fallback(); }
}

/* ---------- Blueprint events ---------- */
function bpHandleClick(e) {
  const t = e.target;
  const side = t.closest('[data-bp-side]');
  if (side) {
    e.preventDefault(); e.stopPropagation();
    const k = side.dataset.bpSide;
    bp.sideCollapsed[k] = !bp.sideCollapsed[k];
    bpSave(); renderTree();
    return true;
  }
  const go = t.closest('[data-bp-goto]');
  if (go) {
    e.preventDefault();
    const id = go.dataset.bpGoto;
    if (id) { let p = bpIndex.get(id); while (p) { bp.collapsed[p.node.id] = false; p = p.parent ? bpIndex.get(p.parent.id) : null; } }
    bpFocus = id || null;
    const hash = id ? '#blueprint/' + id : '#blueprint';
    if (location.hash === hash) route(); else location.hash = hash;
    return true;
  }
  const tog = t.closest('[data-bp-toggle]');
  if (tog) {
    const id = tog.dataset.bpToggle;
    bp.collapsed[id] = !bp.collapsed[id];
    bpSave();
    const el = tog.closest('[data-bp-node]');
    el.classList.toggle('collapsed', bp.collapsed[id]);
    tog.setAttribute('aria-expanded', String(!bp.collapsed[id]));
    return true;
  }
  const chip = t.closest('[data-bp-chip]');
  if (chip) {
    const key = chip.dataset.bpChip, [id, i] = [key.slice(0, key.lastIndexOf(':')), +key.slice(key.lastIndexOf(':') + 1)];
    const base = bpIndex.get(id).node.shelf[i].s;
    const cur = bpChipStatus(key, base);
    bp.chips[key] = STATUSES[(STATUSES.indexOf(cur) + 1) % STATUSES.length];
    bpSave();
    chip.textContent = bp.chips[key];
    chip.className = 'badge ' + statusClass(bp.chips[key]);
    return true;
  }
  const ins = t.closest('[data-bp-ins]');
  if (ins) {
    const ta = document.getElementById('bpd-' + ins.dataset.bpIns) ||
      (() => { const n = bpIndex.get(ins.dataset.bpIns).node; const first = bpSlots(n)[0]; return first && document.getElementById('bpd-' + first.id); })();
    if (!ta) return true;
    const text = ins.dataset.text;
    const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? ta.value.length;
    const pad = start > 0 && !/\s$/.test(ta.value.slice(0, start)) ? ' ' : '';
    ta.focus();
    ta.setRangeText(pad + text, start, end, 'end');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    return true;
  }
  const copy = t.closest('[data-bp-copy]');
  if (copy) { bpCopy(copy.dataset.bpCopy); return true; }
  const act = t.closest('[data-bp-act]');
  if (act) {
    const a = act.dataset.bpAct;
    if (a === 'export') bpExportDrafts();
    else if (a === 'import-project') $('#bpImportProject').click();
    else if (a === 'import-guide') $('#bpImportGuide').click();
    else if (a === 'clear-project' || a === 'clear-guide') {
      const kind = a.slice(6);
      if (confirm('Remove the imported ' + (kind === 'project' ? 'project data' : 'research guide') + ' from this browser?')) { bp.imports[kind] = null; bpSave(true); renderMain(); renderRight(); }
    }
    return true;
  }
  return false;
}

function bpHandleChange(e) {
  const t = e.target;
  if (t.matches('[data-bp-status]')) {
    bp.status[t.dataset.bpStatus] = t.value; bpSave();
    const card = t.closest('.bp-slot');
    card.className = card.className.replace(/\bst-[a-z-]+/, 'st-' + t.value.replace(/\s/g, '-').toLowerCase());
    bpUpdateCounts(); renderTree(); renderRight();
    return true;
  }
  if (t.matches('[data-bp-wf]')) {
    bp.workflow[t.dataset.bpWf] = t.checked; bpSave();
    t.closest('.task').classList.toggle('done', t.checked);
    const sum = view.querySelector('.bp-workflow summary .muted');
    if (sum) sum.textContent = `${BLUEPRINT.workflow.filter((_, i) => bp.workflow[i]).length} of ${BLUEPRINT.workflow.length} done`;
    return true;
  }
  if (t.matches('[data-bp-check]')) {
    bp.checks[t.dataset.bpCheck] = t.checked; bpSave();
    t.closest('.task').classList.toggle('done', t.checked);
    const list = t.closest('.task-list'), prog = list && list.previousElementSibling;
    if (prog && prog.classList.contains('task-progress')) {
      const boxes = list.querySelectorAll('input[type=checkbox]');
      prog.textContent = `${[...boxes].filter(b => b.checked).length} of ${boxes.length} done`;
    }
    return true;
  }
  if (t.id === 'bpUseAim3') { bp.useAim3 = t.checked; bpSave(); const top = view.scrollTop; renderMain(); view.scrollTop = top; renderTree(); renderRight(); return true; }
  if (t.id === 'bpExtraFigures') { bp.extraFigures = Math.max(0, parseInt(t.value, 10) || 0); bpSave(); bpUpdateCounts(); return true; }
  if (t.id === 'bpImportProject' || t.id === 'bpImportGuide') {
    if (t.files[0]) bpImportFile(t.id === 'bpImportProject' ? 'project' : 'guide', t.files[0]);
    t.value = '';
    return true;
  }
  return false;
}

let bpTreeTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.matches || !t.matches('[data-bp-draft]')) return;
  bp.drafts[t.dataset.bpDraft] = t.value;
  bpSave();
  bpUpdateCounts();
  clearTimeout(bpTreeTimer);
  bpTreeTimer = setTimeout(() => { if (state.search) renderTree(); renderRight(); }, 500);
});

bpLoad();

/* ==========================================================================
   13. ROUTING  (#note/<id>, #graph, #blueprint or #blueprint/<slot id>)
   ========================================================================== */
function open(id, edit) {
  state.pendingEdit = !!edit;
  const hash = '#note/' + encodeURIComponent(id);
  if (location.hash === hash) route();
  else location.hash = hash;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'graph') {
    state.mode = 'graph';
  } else if (h === 'blueprint' || h.startsWith('blueprint/')) {
    const id = h.slice(10);
    if (id && bpIndex.has(id)) { bpFocus = id; let p = bpIndex.get(id); while (p) { bp.collapsed[p.node.id] = false; p = p.parent ? bpIndex.get(p.parent.id) : null; } }
    if (state.mode !== 'blueprint' && !bpFocus) view.scrollTop = 0;
    state.mode = 'blueprint';
  } else {
    const id = h.startsWith('note/') ? h.slice(5) : '';
    state.current = getNote(id) ? id : homeId();
    state.mode = state.pendingEdit ? 'edit' : 'view';
    view.scrollTop = 0;
  }
  state.pendingEdit = false;
  document.body.classList.remove('side-open', 'right-open');
  render();
}

/* ==========================================================================
   14. EVENTS (one delegated listener per event type)
   ========================================================================== */
const ACTIONS = {
  'new': () => { const t = prompt('New note title:'); if (t) createNote(t, currentFolder()); },
  'home': () => open(homeId()),
  'blueprint': () => { if (state.mode === 'blueprint') open(state.current || homeId()); else location.hash = '#blueprint'; },
  'graph': () => { if (state.mode === 'graph') open(state.current || homeId()); else location.hash = '#graph'; },
  'edit': () => { state.mode = state.mode === 'edit' ? 'view' : 'edit'; renderMain(); renderTree(); },
  'delete': deleteNote,
  'export-md': exportMarkdown,
  'export-note': exportCurrentNote,
  'backup': backupJSON,
  'import': () => $('#importFile').click(),
  'reset': resetAll,
  'clear-filters': () => { state.search = ''; state.tag = ''; $('#search').value = ''; renderTree(); },
  'toggle-help': () => { const h = $('#edHelp'); if (h) h.hidden = !h.hidden; },
  'toggle-side': () => document.body.classList.toggle('side-open'),
  'toggle-right': () => document.body.classList.toggle('right-open')
};

document.addEventListener('click', e => {
  const t = e.target;

  const act = t.closest('[data-action]');
  if (act && ACTIONS[act.dataset.action]) { e.preventDefault(); ACTIONS[act.dataset.action](); return; }

  if (bpHandleClick(e)) return;

  const ins = t.closest('[data-insert]');
  if (ins) { insertAtCursor(SNIPPETS[ins.dataset.insert]()); return; }

  const badge = t.closest('.badge[data-k]');
  if (badge) { e.preventDefault(); cycleStatus(badge.dataset.note, +badge.dataset.k); return; }

  const link = t.closest('.wikilink');
  if (link) {
    e.preventDefault();
    if (link.dataset.id && getNote(link.dataset.id)) return open(link.dataset.id);
    const target = link.dataset.target;
    const n = findByTitle(target);
    if (n) return open(n.id);
    if (confirm(`"${target}" doesn't exist yet. Create it?`)) createNote(target, currentFolder());
    return;
  }

  const tag = t.closest('.tag');
  if (tag) {
    e.preventDefault();
    state.tag = tag.dataset.tag.toLowerCase();
    renderTree();
    document.body.classList.add('side-open');
    toast(`Showing notes tagged #${state.tag}`);
    return;
  }

  const fh = t.closest('.folder-head');
  if (fh) { state.collapsed[fh.dataset.folder] = !state.collapsed[fh.dataset.folder]; save(); renderTree(); return; }

  const tn = t.closest('.tree-note');
  if (tn) { e.preventDefault(); open(tn.dataset.id); return; }

  // tap outside an open drawer closes it (small screens)
  if (!t.closest('#sidebar') && !t.closest('#right') && !t.closest('#toolbar')) document.body.classList.remove('side-open', 'right-open');
});

document.addEventListener('change', e => {
  const t = e.target;
  if (bpHandleChange(e)) return;
  if (t.matches('.field-input')) setFieldValue(t.dataset.note, +t.dataset.k, t.value);
  else if (t.matches('.task-check')) toggleTask(t.dataset.note, +t.dataset.line, t.checked);
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('.field-input') && e.key === 'Enter') { t.blur(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); document.body.classList.add('side-open'); $('#search').focus(); $('#search').select(); }
  else if (mod && e.key.toLowerCase() === 'e' && state.mode !== 'graph' && state.mode !== 'blueprint') { e.preventDefault(); ACTIONS.edit(); }
  else if (e.key === 'Escape' && state.mode === 'edit' && !t.matches('.field-input')) { ACTIONS.edit(); }
});

$('#search').addEventListener('input', e => { state.search = e.target.value; renderTree(); });
$('#tagFilter').addEventListener('change', e => { state.tag = e.target.value; renderTree(); });
$('#importFile').addEventListener('change', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; });
window.addEventListener('hashchange', route);

/* ==========================================================================
   15. START
   ========================================================================== */
state.notes = loadNotes();
route();
reportBrokenLinks();
</script>
