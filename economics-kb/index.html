<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zambia Debt KB</title>
<!--
  Zambia Debt Burden — Leaving Cert Economics research knowledge base.
  One self-contained file: vanilla HTML + CSS + JS, no libraries, no build step.
  Open it by double-clicking. Your edits are saved in this browser's localStorage.

  HOW TO ADD NOTES IN CODE (optional — you can also use the "+ New note" button):
    Find DEFAULT_NOTES in the <script> below and add an object:
      { id: 'my-note', title: 'My Note', folder: 'Data', type: 'note', body: `...markdown...` }
    Note: DEFAULT_NOTES are only used the first time (or after "Reset").
    Once you have edited anything, your saved copy in localStorage is used instead.

  NOTE SYNTAX (markdown-lite):
    # / ## / ###          headings
    **bold**  *italic*    inline formatting
    - item / 1. item      bullets / numbered lists (indent 2 spaces to nest)
    - [ ] task / - [x]    checkboxes (click to tick)
    | a | b |             tables (second line must be |---|---|)
    > [!warning] Title    callout box (types: note, info, warning, danger, question)
    [[Note title]]        wikilink   ·   [[Note title|shown text]] with alias
    #tag                  tag
    {{fact:STATUS|Source}}        status badge + source label
    {{field:STATUS|value|id}}     editable data field (empty value = MISSING)
    {{tasks:Note title}}          embed the checkboxes from another note
    {{dashboard:counts}}          VERIFIED / NEEDS CHECK / MISSING counts
    {{status-list:MISSING}}       live list of every item with that status
    ~~~chart ... ~~~              line chart (see the Measure 1 note for the format;
                                  "@id" pulls a value from a {{field}} with that id)
  STATUS is one of: VERIFIED, NEEDS CHECK, MISSING

  PROJECT BLUEPRINT: the report scaffold lives in the BLUEPRINT object (section 12b of
  the script). Edit it to change sections, slots, inserts, data shelf chips and rules.
  Drafts and ticks are saved separately in localStorage, so editing the outline is safe.
-->
<style>
/* ==========================================================================
   THEME TOKENS (dark, Obsidian-like)
   ========================================================================== */
:root {
  --bg: #1e1e1e;
  --bg-side: #191919;
  --bg-panel: #232323;
  --bg-input: #161616;
  --bg-btn: #2a2a2a;
  --bg-hover: #2c2c2c;
  --bg-active: #3a3352;
  --border: #303030;
  --border-strong: #444;
  --text: #dcddde;
  --text-soft: #c4c4c4;
  --muted: #9a9a9a;
  --faint: #6b6b6b;
  --accent: #a882ff;
  --accent-soft: rgba(168, 130, 255, 0.14);
  --ok: #4cc38a;
  --ok-bg: rgba(76, 195, 138, 0.12);
  --warn: #e8b04b;
  --warn-bg: rgba(232, 176, 75, 0.12);
  --bad: #f0645a;
  --bad-bg: rgba(240, 100, 90, 0.12);
  --info: #5ba4f0;
  --info-bg: rgba(91, 164, 240, 0.10);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

/* ==========================================================================
   BASE + LAYOUT
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); overflow: hidden; }
input, select, textarea, button { font: inherit; color: inherit; }
a { color: var(--accent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #353535; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

#app { display: grid; grid-template-columns: 272px minmax(0, 1fr) 290px; height: 100vh; }

/* ---------- Left sidebar ---------- */
#sidebar { background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 14px 12px 10px 14px; display: flex; align-items: center; gap: 8px; }
.brand { flex: 1; font-weight: 650; font-size: 14px; line-height: 1.3; }
.brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.side-filters { padding: 0 12px 10px; display: grid; gap: 6px; }
.inp { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 13px; }
.inp:focus, .field-input:focus, textarea:focus { outline: none; border-color: var(--accent); }
.filter-info { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; min-height: 16px; }
.filter-info button { all: unset; cursor: pointer; color: var(--accent); }
#tree { flex: 1; overflow: auto; padding: 2px 6px 14px; }
.folder { margin-bottom: 2px; }
.folder-head { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: 5px; }
.folder-head:hover { background: var(--bg-hover); color: var(--text); }
.folder-head:focus-visible { outline: 1px solid var(--accent); }
.chev { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transition: transform .15s; flex: none; }
.folder.collapsed .chev { transform: rotate(-90deg); }
.folder.collapsed .folder-notes { display: none; }
.count { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--faint); }
.tree-note { display: flex; gap: 7px; align-items: baseline; padding: 3px 8px 3px 21px; color: var(--text-soft); text-decoration: none; font-size: 13.5px; line-height: 1.4; border-radius: 5px; }
.tree-note:hover { background: var(--bg-hover); color: var(--text); }
.tree-note.active { background: var(--bg-active); color: #fff; }
.tree-note .ico { color: var(--faint); font-size: 10px; width: 11px; flex: none; text-align: center; }
.tree-note.active .ico { color: var(--accent); }
.tree-snippet { display: block; font-size: 11.5px; color: var(--faint); padding: 0 8px 4px 39px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-snippet mark { background: var(--accent-soft); color: var(--text); border-radius: 2px; }
.side-foot { border-top: 1px solid var(--border); padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* ---------- Buttons ---------- */
.btn { background: var(--bg-btn); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; line-height: 1.4; }
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn:focus-visible { outline: 1px solid var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #17131f; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.icon-btn { padding: 5px 8px; }

/* ---------- Main pane ---------- */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border); min-height: 46px; }
.crumbs { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--text); font-weight: 500; }
#menuBtn, #linksBtn { display: none; }
#view { flex: 1; overflow: auto; position: relative; }

/* ---------- Right panel ---------- */
#right { background: var(--bg-side); border-left: 1px solid var(--border); overflow: auto; padding: 14px 14px 30px; font-size: 13px; }
#right h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; display: flex; justify-content: space-between; }
#right h3:first-child { margin-top: 4px; }
.rlist { list-style: none; margin: 0; padding: 0; }
.rlist li { padding: 6px 8px; border-radius: 6px; margin-bottom: 3px; background: var(--bg-panel); }
.rlist li .snip { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 2px; }
.rlist a { text-decoration: none; }
.muted { color: var(--muted); }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.mini-stats div { background: var(--bg-panel); border-radius: 6px; padding: 6px; text-align: center; font-size: 10px; letter-spacing: .03em; }
.mini-stats b { display: block; font-size: 17px; letter-spacing: 0; }

/* ==========================================================================
   NOTE CONTENT
   ========================================================================== */
.note { max-width: 880px; margin: 0 auto; padding: 26px 40px 90px; }
.note-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pill { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--muted); }
.pill.type-data { border-color: var(--info); color: var(--info); }
.pill.type-dashboard { border-color: var(--accent); color: var(--accent); }
.note-title { font-size: 30px; line-height: 1.2; margin: 4px 0 18px; font-weight: 700; letter-spacing: -0.01em; }
.note-body h1, .note-body h2, .note-body h3, .note-body h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
.note-body h1 { font-size: 24px; }
.note-body h2 { font-size: 19px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.note-body h3 { font-size: 16px; }
.note-body h4 { font-size: 14.5px; color: var(--text-soft); }
.note-body p { margin: .6em 0; }
.note-body ul, .note-body ol { padding-left: 1.4em; margin: .5em 0; }
.note-body li { margin: .22em 0; }
.note-body li::marker { color: var(--faint); }
.note-body li.task-item { list-style: none; margin-left: -1.3em; }
.note-body strong { color: #fff; font-weight: 650; }
.note-body em { color: var(--text-soft); }
.note-body code { font-family: var(--mono); font-size: .88em; background: var(--bg-panel); padding: 1px 5px; border-radius: 4px; }
.note-body pre { background: var(--bg-panel); padding: 12px 14px; border-radius: 8px; overflow: auto; }
.note-body pre code { background: none; padding: 0; }
.note-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
.note-body blockquote { margin: .8em 0; padding: 2px 14px; border-left: 3px solid var(--border-strong); color: var(--text-soft); }

.wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(168,130,255,.35); cursor: pointer; }
.wikilink:hover { border-bottom-color: var(--accent); }
.wikilink.unresolved { color: #8f7fb6; border-bottom-style: dashed; opacity: .85; }
.tag { display: inline-block; background: var(--accent-soft); color: #c5adff; text-decoration: none; font-size: .82em; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.tag:hover { background: rgba(168,130,255,.26); }

/* Tables */
.table-wrap { overflow-x: auto; margin: .8em 0; border: 1px solid var(--border); border-radius: 8px; }
.note-body table { border-collapse: collapse; width: 100%; font-size: 14px; }
.note-body th, .note-body td { padding: 7px 11px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.note-body th { background: var(--bg-panel); font-weight: 600; font-size: 12.5px; color: var(--text-soft); }
.note-body tr:last-child td { border-bottom: 0; }
.note-body td + td, .note-body th + th { border-left: 1px solid var(--border); }

/* Callouts: > [!type] Title */
.callout { margin: 1em 0; border-radius: 8px; padding: 10px 14px; border-left: 3px solid var(--info); background: var(--info-bg); }
.callout-title { font-weight: 650; margin-bottom: 2px; }
.callout-body > :first-child { margin-top: 2px; }
.callout-body > :last-child { margin-bottom: 0; }
.callout-warning { border-color: var(--warn); background: var(--warn-bg); }
.callout-warning .callout-title { color: var(--warn); }
.callout-danger { border-color: var(--bad); background: var(--bad-bg); }
.callout-danger .callout-title { color: var(--bad); }
.callout-question { border-color: var(--accent); background: var(--accent-soft); }
.callout-question .callout-title { color: #c5adff; }
.callout-note .callout-title, .callout-info .callout-title { color: var(--info); }

/* Status badges (click to cycle) */
.fact { white-space: normal; }
.badge { font: 650 10px/1 var(--sans); letter-spacing: .05em; padding: 3px 6px 3px; border-radius: 4px; border: 1px solid; cursor: pointer; vertical-align: 1px; white-space: nowrap; background: transparent; margin-left: 2px; }
.badge:hover { filter: brightness(1.25); }
.badge:focus-visible { outline: 1px solid #fff; }
.s-verified { color: var(--ok); border-color: rgba(76,195,138,.55); background: var(--ok-bg); }
.s-needs { color: var(--warn); border-color: rgba(232,176,75,.55); background: var(--warn-bg); }
.s-missing { color: var(--bad); border-color: rgba(240,100,90,.6); background: var(--bad-bg); }
.src { font-size: 12px; color: var(--muted); margin-left: 6px; font-style: italic; }
.src::before { content: "— "; }

/* Editable data fields */
.field { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.field-input { background: var(--bg-input); border: 1px dashed rgba(240,100,90,.6); border-radius: 5px; padding: 2px 7px; font-size: 13.5px; min-width: 6em; max-width: 100%; }
.field.filled .field-input { border-style: solid; border-color: var(--border-strong); }
.field-input::placeholder { color: #8a5550; font-style: italic; }

/* Tasks */
.task { display: inline-flex; gap: 9px; align-items: baseline; }
.task input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; transform: translateY(2px); flex: none; }
.task.done > span { color: var(--faint); text-decoration: line-through; }
.task-list { list-style: none; padding-left: 0 !important; }
.task-progress { font-size: 12px; color: var(--muted); margin: -2px 0 6px; }

/* Dashboard tiles */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 8px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--bg-panel); }
.stat-n { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.stat.s-verified .stat-n { color: var(--ok); }
.stat.s-needs .stat-n { color: var(--warn); }
.stat.s-missing .stat-n { color: var(--bad); }
.stat.s-verified, .stat.s-needs, .stat.s-missing { background: var(--bg-panel); }
.stackbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--bg-panel); margin-bottom: 18px; gap: 2px; }
.stackbar span { display: block; height: 100%; border: 0; }
.stackbar .s-verified { background: var(--ok); }
.stackbar .s-needs { background: var(--warn); }
.stackbar .s-missing { background: var(--bad); }
.slist { margin: .4em 0 1em; }
.slist details { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-panel); }
.slist summary { cursor: pointer; padding: 8px 12px; font-size: 13.5px; color: var(--text-soft); }
.slist-inner { padding: 0 12px 10px; }
.slist-group { margin-top: 8px; }
.slist-group > .wikilink { font-weight: 600; font-size: 13.5px; }
.slist ul { list-style: none; padding-left: 0; margin: 4px 0 0; }
.slist li { font-size: 13.5px; padding: 3px 0 3px 2px; display: flex; gap: 8px; align-items: baseline; }
.slist li .ctx { color: var(--text-soft); }
.slist li .where { color: var(--faint); font-size: 12px; }

/* Charts */
.chart { margin: 1.2em 0; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 10px; }
.chart-title { font-weight: 650; font-size: 14.5px; margin-bottom: 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.chart .grid { stroke: #343434; stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11.5px; font-family: var(--sans); }
.chart .legend { fill: var(--text-soft); font-size: 12px; font-family: var(--sans); }
.chart .val { font-size: 10.5px; font-weight: 600; font-family: var(--sans); }
.chart .series-line { fill: none; stroke-width: 2.5; stroke-linecap: round; }
.chart .proj-bg { fill: rgba(255,255,255,.035); }
.chart .proj-label { fill: var(--faint); font-size: 11px; font-family: var(--sans); font-style: italic; }
.chart .empty-msg { fill: var(--muted); font-size: 13px; font-family: var(--sans); }
.chart-error { color: var(--bad); font-size: 13px; padding: 8px 12px; border: 1px dashed var(--bad); border-radius: 8px; }

/* ==========================================================================
   EDITOR
   ========================================================================== */
.editor { padding: 14px 18px 18px; display: flex; flex-direction: column; height: 100%; gap: 10px; }
.props { display: grid; grid-template-columns: 2fr 1.4fr 1fr; gap: 10px; }
.props label { font-size: 11.5px; color: var(--muted); display: grid; gap: 3px; }
.ed-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-help { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; line-height: 1.7; columns: 2; column-gap: 28px; }
.ed-help code { font-family: var(--mono); color: #c5adff; font-size: 12px; }
.ed-split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
#edBody { width: 100%; height: 100%; min-height: 300px; resize: none; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font: 13.5px/1.6 var(--mono); color: var(--text); tab-size: 2; }
.ed-preview { overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 4px 18px 20px; min-height: 0; }

/* ==========================================================================
   GRAPH VIEW (canvas 3D engine — colours live in FOLDER_COLORS / GRAPH_LOOK)
   ========================================================================== */
.graph-wrap { position: absolute; inset: 0; overflow: hidden; }
#graphCanvas { display: block; touch-action: none; cursor: grab; }
#graphCanvas:active { cursor: grabbing; }
.g-bar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.g-bar > * { pointer-events: auto; }
.g-bar .btn { background: rgba(42,42,42,.92); }
.g-bar .btn.on { background: var(--accent-soft); }
.g-bar .btn[disabled] { opacity: .4; cursor: default; }
.g-seg { display: inline-flex; }
.g-seg .btn:first-child { border-radius: 6px 0 0 6px; }
.g-seg .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
#gSearch { width: 180px; margin-left: auto; background: rgba(22,22,22,.92); }
.g-depth { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); background: rgba(42,42,42,.92); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
.g-depth input { width: 60px; accent-color: var(--accent); }
.g-legend { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 1px; background: rgba(25,25,25,.9); border: 1px solid var(--border); border-radius: 8px; padding: 6px; max-height: 45%; overflow: auto; }
.g-legend summary { cursor: pointer; font-size: 12px; color: var(--text-soft); padding: 0 6px 2px; }
.g-group { all: unset; display: flex; gap: 7px; align-items: center; font-size: 12px; padding: 2px 6px; border-radius: 5px; cursor: pointer; color: var(--text-soft); }
.g-group:hover { background: var(--bg-hover); }
.g-group:focus-visible { outline: 1px solid var(--accent); }
.g-group.off { opacity: .4; text-decoration: line-through; }
.g-forces { position: absolute; left: 12px; bottom: 32px; background: rgba(25,25,25,.92); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); width: 240px; }
.g-forces summary { cursor: pointer; color: var(--text-soft); }
.g-forces label { display: grid; grid-template-columns: 1fr 90px 36px; gap: 6px; align-items: center; margin: 6px 0; }
.g-forces input { accent-color: var(--accent); width: 100%; }
.g-forces .btn { margin-top: 4px; width: 100%; }
.g-hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--faint); pointer-events: none; }
.mini-graph { height: 230px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); position: relative; overflow: hidden; }
.mini-graph-canvas { display: block; touch-action: none; }
.mini-depth { margin-top: 6px; background: transparent; border: 0; padding: 0; }
.legend-list { list-style: none; padding: 0; margin: 0; }
.legend-list li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.folder-badge { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 9px; border-radius: 999px; border: 1px solid; }

/* Toast */
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2d2d2d; border: 1px solid var(--border-strong); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ==========================================================================
   PROJECT BLUEPRINT
   ========================================================================== */
.bp-wrap { position: relative; }
.bp-sticky { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 9px 40px; background: rgba(30,30,30,.96); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); backdrop-filter: blur(4px); }
.bp-sticky b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.bp-sticky .over, .bp-sticky .over b { color: var(--bad); }
.bp-sticky-actions { margin-left: auto; }

`## The brief
Leaving Cert Economics research study, **2027 brief**. #overview

- **Country:** Zambia, a Least Developed Country (LDC). #LDC
- **Main challenge:** the **debt burden**. #debt
- **Impacts** (not separate challenges): education, health, growth, the kwacha, inflation.
- **Causes:** copper dependence, borrowing for infrastructure, external shocks (COVID, drought).

## Two measures of the debt burden
1. **Government debt as % of GDP** — the *stock*. → [[Measure 1 - Public Debt % of GDP]]
2. **Debt servicing cost** — the yearly *flow*. → [[Measure 2 - Debt Servicing Cost]]

## Where everything is
- The question: [[Line of Enquiry]] · the aims: [[Aims]] · the plan: [[Report Structure]]
- What happened: [[Timeline]] · what the government did: [[Government Response]]
- Impact evidence: [[Impact Data]] · syllabus: [[Course Links]]
- Gaps and tasks: [[Data Gaps]] · [[To-do]]`

## The IMF series
| Year | Public debt % of GDP | Revenue % of GDP | Note |
|---|---|---|---|
| 2021 | 112.1 | 22.4 | |
| 2022 | 110.9 | 20.4 | |
| 2023 | **133.4** | 21.9 | Peak |
| 2024 | 101.8 | 23.1 | |
| 2025 | 87.6 | 23.3 | |

| 2027 | 68.5 | 23.5 | Projection |

- Public debt series {{fact:VERIFIED|IMF Country Report, sixth and final ECF review}}
- Revenue series {{fact:VERIFIED|IMF Country Report, same table}}

> [!danger] Correction
> Do **not** use "133% of GDP at end-2021" (from a 2022 news report). The IMF series shows 112.1% in 2021 and the 133.4% peak in 2023. Always use the IMF series — see [[Dashboard]].

## External debt (a different measure)
- External debt about **63% of GDP** at end-2025. {{fact:NEEDS CHECK|Coface country risk file}}
- Do **not** put this on the same graph as the public debt series without clear labelling.

## Creditor mix, end-September 2025
- About **two-thirds** of debt held by foreign creditors in foreign currency. {{fact:NEEDS CHECK|Coface}}

| Creditor type | Share of debt | Status |
|---|---|---|
| Multilateral | 17% | {{fact:NEEDS CHECK|Coface}} |
| Bilateral (China, Paris Club, Saudi Arabia, India) | 22% | {{fact:NEEDS CHECK|Coface}} |
| Private | 20% | {{fact:NEEDS CHECK|Coface}} |

*Check when verifying: the three shares listed add to 59%, while the headline says about two-thirds — find out exactly what Coface's shares are measured against before using them.*

## Other sources disagree
FocusEconomics, Coface and Trading Economics give different debt-to-GDP figures. Decision: **use the IMF series** and state this as a data limitation → [[Sources Disagree (Data Limitation)]].

## Course links
4.2 Fiscal Policy and the Budget Framework · 4.1 National Income (GDP is the denominator) · 1.3 Sustainability · 5.1 Economic Growth and Development → [[Course Links]]`

## Government debt in US dollars
- Government debt 2025: **USD 16,145.2m**, up from **USD 15,434m** in 2024. {{fact:VERIFIED|Trading Economics / Bank of Zambia, accessed 6 Oct 2026}}
- This is the **all-time high** in a series running from 2002. {{fact:VERIFIED|Trading Economics / Bank of Zambia, accessed 6 Oct 2026}}

`How the government has tried to overcome the debt burden — four strands. Dates and figures are in [[Timeline]]; this feeds Aim 2 in [[Aims]]. #response

## 1. External support
- IMF **Extended Credit Facility** (ECF) — approved Aug 2022, raised in 2024 (see [[Timeline]]).
- **G20 Common Framework** for restructuring.

## 2. Creditor negotiations
- **China**, other **bilateral** creditors, and **Eurobond holders**.
- Who is owed what: creditor mix in [[Measure 1 - Public Debt % of GDP]].
- Progress (Eurobond exchange 2024; share of restructuring perimeter agreed by early 2026): [[Timeline]].

## 3. Domestic fiscal reform
- Wider tax base.
- Better tax administration.
- Spending reprioritisation.
- Evidence to use: revenue % of GDP in [[Measure 1 - Public Debt % of GDP]].

## 4. Protecting social spending
- Hiring teachers and health workers under the programme. {{fact:NEEDS CHECK|Source to add}}
- Evidence needed: education and health spending shares — MISSING in [[Impact Data]].

## Results and what is still fragile (for the evaluation)
**What has improved** (IMF series and [[Timeline]]):
- Debt ratio down from the 2023 peak of 133.4% to 87.6% of GDP in 2025.
- Programme completed early 2026; inflation back in the target band; reserves about $6.4bn.

**Still fragile in 2026:**
- IMF: debt sustainable but at **high risk** of overall and external debt distress.
- Fiscal pressure rising again: election spending, weaker tax collection, civil service wage adjustment, agricultural subsidy overruns.
- Primary surplus 3.1% of GDP in 2025, projected 1.1% in 2026.
- Debt in USD at a record high while the ratio falls — to investigate → [[Trading Economics - Government Debt]]

Course links: 4.2 fiscal policy, 1.3 sustainability → [[Course Links]]`

/* ==========================================================================
   3. STATE & STORAGE
   ========================================================================== */
const state = {
  notes: [],
  current: null,        // id of the open note
  mode: 'view',         // 'view' | 'edit' | 'graph'
  pendingEdit: false,   // open the next routed note in edit mode
  search: '',
  tag: '',
  collapsed: {}         // folder name -> true when collapsed
};

function loadNotes() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.notes) && data.notes.length) {
        state.collapsed = data.collapsed || {};
        return data.notes;
      }
    }
  } catch (e) { /* storage blocked or corrupt: fall back to defaults */ }
  return JSON.parse(JSON.stringify(DEFAULT_NOTES));
}

let saveWarned = false;
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, notes: state.notes, collapsed: state.collapsed }));
  } catch (e) {
    if (!saveWarned) { toast('Could not save in this browser — use "Backup JSON" to keep your work.'); saveWarned = true; }
  }
}

/* ==========================================================================
   4. SMALL HELPERS
   ========================================================================== */
const $ = (sel, el = document) => el.querySelector(sel);
const view = $('#view');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/* Case/dash-insensitive key so [[measure 1 – public debt % of gdp]] still resolves */
function normTitle(t) {
  return String(t).toLowerCase().replace(/[–—]/g, '-').replace(/\s+/g, ' ').trim();
}
function getNote(id) { return state.notes.find(n => n.id === id); }
/* Resolve a [[link]] by title first, then by any old title kept in n.aliases */
function findByTitle(t) {
  const k = normTitle(t);
  return state.notes.find(n => normTitle(n.title) === k) ||
    state.notes.find(n => (n.aliases || []).some(a => normTitle(a) === k));
}
function titleKeys(n) { return new Set([n.title, ...(n.aliases || [])].map(normTitle)); }
function homeId() { return getNote('dashboard') ? 'dashboard' : (state.notes[0] && state.notes[0].id); }
function folderRank(f) { const i = FOLDER_ORDER.indexOf(f); return i < 0 ? 999 : i; }
function folderColor(f) {
  const all = allFolders();
  return FOLDER_COLORS[Math.max(0, all.indexOf(f)) % FOLDER_COLORS.length];
}
function allFolders() {
  return [...new Set(state.notes.map(n => n.folder || 'Unfiled'))]
    .sort((a, b) => folderRank(a) - folderRank(b) || a.localeCompare(b));
}
function parseLink(inner) {
  const bar = inner.indexOf('|');
  const target = (bar < 0 ? inner : inner.slice(0, bar)).trim();
  const label = (bar < 0 ? target : inner.slice(bar + 1)).trim() || target;
  return { target, label };
}
function normStatus(s) {
  s = String(s || '').trim().toUpperCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
  return STATUSES.includes(s) ? s : 'NEEDS CHECK';
}
function statusClass(s) { return { 'VERIFIED': 's-verified', 'NEEDS CHECK': 's-needs', 'MISSING': 's-missing' }[s]; }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50); }
function uniqueId(title) {
  const base = slug(title) || 'note';
  let id = base, i = 2;
  while (getNote(id)) id = base + '-' + i++;
  return id;
}
/* Strip markup from one line so it can be shown as a plain snippet */
function plainText(s) {
  return String(s)
    .replace(TOKEN_RE, ' ')
    .replace(LINK_RE, (m, inner) => parseLink(inner).label)
    .replace(/^\s*(#{1,6}|>|[-*+]|\d+[.)])\s+/, '')
    .replace(/\[![a-z]+\]\s*/i, '')
    .replace(/\[[ xX]\]\s*/, '')
    .replace(/\*\*|__|`/g, '')
    .replace(/\|/g, ' · ')
    .replace(/(\s*·\s*){2,}/g, ' · ')
    .replace(/^\s*·\s*|\s*·\s*$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Link / tag analysis ---------- */
function outgoingLinks(note) {
  const out = [];
  for (const m of note.body.matchAll(LINK_RE)) {
    const { target } = parseLink(m[1]);
    if (!out.some(o => normTitle(o) === normTitle(target))) out.push(target);
  }
  return out;
}
function backlinks(note) {
  const keys = titleKeys(note);
  return state.notes.filter(n => n.id !== note.id && outgoingLinks(n).some(t => keys.has(normTitle(t)) && findByTitle(t) === note));
}
function tagsOf(note) {
  const body = note.body
    .replace(/^\s*(```|~~~)[\s\S]*?^\s*\1/gm, ' ')
    .replace(TOKEN_RE, ' ')
    .replace(LINK_RE, ' ');
  const set = new Set();
  for (const m of body.matchAll(TAG_RE)) set.add(m[2].toLowerCase());
  return [...set];
}

/* ==========================================================================
   5. STATUS ITEMS (facts + fields)
   Every {{fact:...}} and {{field:...}} in a note gets an index k (0, 1, 2…)
   in order of appearance. Badges carry data-note + data-k so a click can
   find and rewrite exactly that token in the note's text.
   ========================================================================== */
function editStatusToken(note, k, mutate) {
  let n = -1;
  note.body = note.body.replace(TOKEN_RE, (m, kind, args) => {
    if (kind !== 'fact' && kind !== 'field') return m;
    n++;
    if (n !== k) return m;
    const a = args.split('|');
    mutate(kind, a);
    return '{{' + kind + ':' + a.join('|') + '}}';
  });
}

function scanStatusItems() {
  const items = [];
  for (const note of state.notes) {
    let k = 0, heading = '';
    for (const line of note.body.split('\n')) {
      const h = line.match(/^#{1,6}\s+(.*)$/);
      if (h) heading = plainText(h[1]);
      for (const m of line.matchAll(TOKEN_RE)) {
        if (m[1] !== 'fact' && m[1] !== 'field') continue;
        const a = m[2].split('|');
        items.push({
          note, k: k++, kind: m[1],
          status: normStatus(a[0]),
          label: m[1] === 'fact' ? a.slice(1).join('|').trim() : (a[1] || '').trim(),
          id: m[1] === 'field' ? (a[2] || '').trim() : '',
          context: plainText(line),
          heading
        });
      }
    }
  }
  return items;
}

function countStatuses(items) {
  const c = { 'VERIFIED': 0, 'NEEDS CHECK': 0, 'MISSING': 0 };
  items.forEach(i => c[i.status]++);
  return c;
}

/* Value of a {{field:...|value|id}} anywhere in the vault (used by charts: @id) */
function fieldValueById(id) {
  for (const n of state.notes) {
    for (const m of n.body.matchAll(TOKEN_RE)) {
      if (m[1] !== 'field') continue;
      const a = m[2].split('|');
      if ((a[2] || '').trim() === id) return (a[1] || '').trim();
    }
  }
  return '';
}

function cycleStatus(noteId, k) {
  const note = getNote(noteId);
  if (!note) return;
  editStatusToken(note, k, (kind, a) => {
    const cur = normStatus(a[0]);
    a[0] = STATUSES[(STATUSES.indexOf(cur) + 1) % STATUSES.length];
  });
  afterDataChange();
}

function setFieldValue(noteId, k, value) {
  const note = getNote(noteId);
  if (!note) return;
  const val = value.replace(/[|{}\r\n]/g, ' ').trim();   // keep the token syntax intact
  editStatusToken(note, k, (kind, a) => {
    if (a.length < 2) a[1] = '';
    a[1] = val;
    const cur = normStatus(a[0]);
    if (!val) a[0] = 'MISSING';                    // emptied → MISSING
    else if (cur === 'MISSING') a[0] = 'NEEDS CHECK';  // newly filled → needs checking
  });
  afterDataChange();
}

function toggleTask(noteId, lineNo, checked) {
  const note = getNote(noteId);
  if (!note) return;
  const lines = note.body.split('\n');
  if (lines[lineNo] === undefined) return;
  lines[lineNo] = lines[lineNo].replace(/\[( |x|X)\]/, checked ? '[x]' : '[ ]');
  note.body = lines.join('\n');
  afterDataChange();
}

/* Save, then re-render on the next tick (so Tab-focus moves are kept) */
function afterDataChange() {
  save();
  setTimeout(() => {
    const a = document.activeElement;
    const focusKey = a && a.classList && a.classList.contains('field-input') ? [a.dataset.note, a.dataset.k] : null;
    const scroller = state.mode === 'edit' ? $('#edPreview') : view;
    const top = scroller ? scroller.scrollTop : 0;
    if (state.mode === 'edit') {
      const note = getNote(state.current), ta = $('#edBody'), pv = $('#edPreview');
      if (note && ta && ta.value !== note.body) ta.value = note.body;
      if (note && pv) pv.innerHTML = renderBody(note);
    } else {
      renderMain();
    }
    renderTree();
    renderRight();
    const sc = state.mode === 'edit' ? $('#edPreview') : view;
    if (sc) sc.scrollTop = top;
    if (focusKey) {
      const el = document.querySelector(`.field-input[data-note="${CSS.escape(focusKey[0])}"][data-k="${focusKey[1]}"]`);
      if (el) el.focus();
    }
  }, 0);
}

/* ==========================================================================
   6. MARKDOWN-LITE RENDERER
   Step 1: swap every {{token}} and [[link]] for a placeholder so pipes
           inside them can't break tables.
   Step 2: parse blocks line by line (headings, lists, tables, callouts…).
   Step 3: inline formatting, then placeholders become HTML.
   ========================================================================== */
function renderBody(note) {
  const slots = [];
  let k = 0;
  const src = note.body.replace(/\r/g, '')
    .replace(TOKEN_RE, (m, kind, args) => {
      const s = { t: 'token', kind, args: args.split('|'), raw: m };
      if (kind === 'fact' || kind === 'field') s.k = k++;
      slots.push(s);
      return '\u0001' + (slots.length - 1) + '\u0002';
    })
    .replace(LINK_RE, (m, inner) => {
      slots.push({ t: 'link', inner, raw: m });
      return '\u0001' + (slots.length - 1) + '\u0002';
    });
  const ctx = { note, slots };
  return parseBlocks(src.split('\n'), 0, ctx) || '<p class="muted"><em>Empty note — click Edit to start writing.</em></p>';
}

function restoreRaw(s, ctx) { return s.replace(PH_RE, (m, n) => ctx.slots[+n].raw); }

function isBlockTokenLine(line, ctx) {
  const m = line.trim().match(/^\u0001(\d+)\u0002$/);
  const s = m && ctx.slots[+m[1]];
  return s && s.t === 'token' && BLOCK_TOKENS.includes(s.kind) ? s : null;
}

function isTableStart(lines, i) {
  return lines[i].includes('|') && i + 1 < lines.length && lines[i + 1].includes('|') && TABLE_SEP.test(lines[i + 1]);
}

function startsBlock(lines, i, ctx) {
  const l = lines[i];
  return /^\s*(```|~~~)/.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || LIST_RE.test(l) ||
    /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l) || isTableStart(lines, i) || !!isBlockTokenLine(l, ctx);
}

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}

/* offset = line number of lines[0] inside the note body (used for task ticking) */
function parseBlocks(lines, offset, ctx) {
  let html = '', i = 0, m;
  const blank = l => /^\s*$/.test(l);

  while (i < lines.length) {
    const line = lines[i];
    if (blank(line)) { i++; continue; }

    // Fenced block: ~~~chart / ```chart → SVG chart; anything else → code
    if ((m = line.match(/^\s*(```|~~~)\s*([\w-]*)\s*$/))) {
      const fence = m[1], lang = m[2].toLowerCase(), buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
      i++;
      const raw = restoreRaw(buf.join('\n'), ctx);
      html += lang === 'chart' ? renderChart(raw) : `<pre><code>${esc(raw)}</code></pre>`;
      continue;
    }

    // Heading
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const lvl = m[1].length;
      html += `<h${lvl}>${inline(m[2], ctx)}</h${lvl}>`;
      i++; continue;
    }

    // Horizontal rule
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += '<hr>'; i++; continue; }

    // Blockquote or Obsidian-style callout: > [!warning] Title
    if (/^\s*>/.test(line)) {
      const start = i, buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      const cm = buf[0].match(/^\[!(\w+)\]\s*(.*)$/);
      if (cm) {
        const type = cm[1].toLowerCase();
        html += `<div class="callout callout-${esc(type)}"><div class="callout-title">${inline(cm[2] || type, ctx)}</div>` +
                `<div class="callout-body">${parseBlocks(buf.slice(1), offset + start + 1, ctx)}</div></div>`;
      } else {
        html += `<blockquote>${parseBlocks(buf, offset + start, ctx)}</blockquote>`;
      }
      continue;
    }

    // Table
    if (isTableStart(lines, i)) {
      const header = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && !blank(lines[i])) rows.push(splitRow(lines[i++]));
      html += '<div class="table-wrap"><table><thead><tr>' +
        header.map(c => `<th>${inline(c, ctx)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + header.map((_, j) => `<td>${inline(r[j] || '', ctx)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>';
      continue;
    }

    // List (bullets, numbers, tasks)
    if (LIST_RE.test(line)) {
      const r = parseList(lines, i, offset, ctx);
      html += r.html; i = r.next; continue;
    }

    // A line holding only a block token, e.g. {{dashboard:counts}}
    const bt = isBlockTokenLine(line, ctx);
    if (bt) { html += renderSlot(bt, ctx); i++; continue; }

    // Paragraph (single newlines become <br>)
    const buf = [];
    while (i < lines.length && !blank(lines[i]) && (buf.length === 0 || !startsBlock(lines, i, ctx))) buf.push(lines[i++]);
    html += `<p>${buf.map(l => inline(l, ctx)).join('<br>')}</p>`;
  }
  return html;
}

function parseList(lines, i, offset, ctx) {
  const items = [];
  while (i < lines.length) {
    const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (!m) {
      // indented continuation line belongs to the previous item
      if (items.length && /^\s{2,}\S/.test(lines[i]) && !LIST_RE.test(lines[i])) {
        items[items.length - 1].text += ' ' + lines[i].trim(); i++; continue;
      }
      break;
    }
    items.push({ indent: m[1].replace(/\t/g, '    ').length, ordered: /\d/.test(m[2]), text: m[3], lineNo: offset + i });
    i++;
  }

  let html = '';
  const stack = [];   // open lists: { indent, tag }
  for (const it of items) {
    while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) html += '</li></' + stack.pop().tag + '>';
    const top = stack[stack.length - 1];
    if (!top || it.indent > top.indent) {
      const tag = it.ordered ? 'ol' : 'ul';
      stack.push({ indent: it.indent, tag });
      html += `<${tag}>`;
    } else {
      html += '</li>';
    }
    const task = it.text.match(/^\[( |x|X)\]\s+(.*)$/);
    if (task) {
      const done = task[1] !== ' ';
      html += `<li class="task-item">${taskHTML(ctx.note.id, it.lineNo, done, inline(task[2], ctx))}`;
    } else {
      html += `<li>${inline(it.text, ctx)}`;
    }
  }
  while (stack.length) html += '</li></' + stack.pop().tag + '>';
  return { html, next: i };
}

function inline(text, ctx) {
  let s = esc(text);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?![*\w])/g, '$1<em>$2</em>');
  s = s.replace(TAG_RE, '$1<a href="#" class="tag" data-tag="$2">#$2</a>');
  s = s.replace(PH_RE, (m, n) => renderSlot(ctx.slots[+n], ctx));
  return s;
}

/* Turn one placeholder back into HTML */
function renderSlot(s, ctx) {
  if (!s) return '';
  if (s.t === 'link') {
    const { target, label } = parseLink(s.inner);
    const n = findByTitle(target);
    return `<a href="#" class="wikilink${n ? '' : ' unresolved'}" data-target="${esc(target)}"` +
      `${n ? ` data-id="${esc(n.id)}"` : ''} title="${n ? esc(n.title) : 'Not created yet — click to create'}">${esc(label)}</a>`;
  }
  const a = s.args, noteId = ctx.note.id;
  switch (s.kind) {
    case 'fact': {
      const source = a.slice(1).join('|').trim();
      return `<span class="fact">${badgeHTML(noteId, s.k, normStatus(a[0]))}${source ? `<span class="src">${esc(source)}</span>` : ''}</span>`;
    }
    case 'field': return fieldHTML(noteId, s.k, a);
    case 'dashboard': return (a[0] || '').trim() === 'counts' ? renderCounts() : '';
    case 'status-list': return renderStatusList(normStatus(a[0]), (a[1] || '').trim() === 'collapsed');
    case 'tasks': return renderEmbeddedTasks((a[0] || '').trim());
    default: return esc(s.raw);
  }
}

function badgeHTML(noteId, k, status) {
  return `<button type="button" class="badge ${statusClass(status)}" data-note="${esc(noteId)}" data-k="${k}" title="Click to change status">${status}</button>`;
}

function fieldHTML(noteId, k, a) {
  const status = normStatus(a[0]);
  const val = (a[1] || '').trim();
  const id = (a[2] || '').trim();
  return `<span class="field${val ? ' filled' : ''}">` +
    `<input class="field-input" data-note="${esc(noteId)}" data-k="${k}" value="${esc(val)}" placeholder="add value" ` +
    `size="${Math.max(9, val.length + 2)}" title="${id ? 'Field: ' + esc(id) + ' — ' : ''}Type a value, then press Enter" aria-label="Data value${id ? ' ' + esc(id) : ''}">` +
    badgeHTML(noteId, k, status) + '</span>';
}

function taskHTML(noteId, lineNo, done, textHTML) {
  return `<span class="task${done ? ' done' : ''}"><input type="checkbox" class="task-check" data-note="${esc(noteId)}" data-line="${lineNo}"${done ? ' checked' : ''} aria-label="Done"><span>${textHTML}</span></span>`;
}

/* ---------- Dashboard widgets ---------- */
function renderCounts() {
  const items = scanStatusItems();
  const c = countStatuses(items);
  const total = items.length || 1;
  return '<div class="stats">' +
    STATUSES.map(s => `<div class="stat ${statusClass(s)}"><div class="stat-n">${c[s]}</div><div class="stat-l">${s}</div></div>`).join('') +
    `<div class="stat"><div class="stat-n">${items.length}</div><div class="stat-l">Items tracked</div></div></div>` +
    '<div class="stackbar" title="Share of items by status">' +
    STATUSES.map(s => c[s] ? `<span class="${statusClass(s)}" style="width:${(c[s] / total * 100).toFixed(2)}%"></span>` : '').join('') +
    '</div>';
}

function renderStatusList(status, collapsed) {
  const items = scanStatusItems().filter(i => i.status === status);
  if (!items.length) return `<p class="muted">Nothing is marked ${status} right now.</p>`;
  const groups = new Map();
  items.forEach(i => { if (!groups.has(i.note.id)) groups.set(i.note.id, []); groups.get(i.note.id).push(i); });
  let inner = '';
  for (const [id, list] of groups) {
    const note = getNote(id);
    inner += `<div class="slist-group"><a href="#" class="wikilink" data-id="${esc(id)}" data-target="${esc(note.title)}">${esc(note.title)}</a> <span class="muted">(${list.length})</span><ul>` +
      list.map(i => {
        let ctxText = i.context || i.id || i.heading || '';
        if (i.kind === 'field' && i.heading && !ctxText.includes(i.heading)) ctxText = i.heading + ' › ' + ctxText;
        const detail = i.kind === 'fact' ? i.label : (i.label ? 'value: ' + i.label : (i.id ? 'field ' + i.id : ''));
        return `<li>${badgeHTML(id, i.k, i.status)}<span><span class="ctx">${esc(truncate(ctxText, 140))}</span>` +
          `${detail ? ` <span class="where">· ${esc(detail)}</span>` : ''}</span></li>`;
      }).join('') + '</ul></div>';
  }
  return `<div class="slist"><details${collapsed ? '' : ' open'}><summary>${items.length} item${items.length === 1 ? '' : 's'} marked <b>${status}</b></summary><div class="slist-inner">${inner}</div></details></div>`;
}

function renderEmbeddedTasks(title) {
  const src = findByTitle(title);
  if (!src) return `<p class="muted">No note called "${esc(title)}".</p>`;
  const tasks = [];
  src.body.split('\n').forEach((line, lineNo) => {
    const m = line.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)$/);
    if (m) tasks.push({ lineNo, done: m[1] !== ' ', text: m[2] });
  });
  if (!tasks.length) return '<p class="muted">No tasks yet.</p>';
  const done = tasks.filter(t => t.done).length;
  const mini = { note: src, slots: [] };
  return `<div class="task-progress">${done} of ${tasks.length} done</div><ul class="task-list">` +
    tasks.map(t => {
      const text = t.text.replace(TOKEN_RE, '').replace(LINK_RE, (m, inner) => { mini.slots.push({ t: 'link', inner, raw: m }); return '\u0001' + (mini.slots.length - 1) + '\u0002'; });
      return `<li class="task-item">${taskHTML(src.id, t.lineNo, t.done, inline(text, mini))}</li>`;
    }).join('') + '</ul>';
}

/* ==========================================================================
   7. SVG LINE CHARTS
   ~~~chart
   title: …
   years: 2021, 2022, …
   projection-from: 2026          (optional: from this year on, lines are dashed)
   unit: % of GDP
   series: Name | 1.2, 3.4, , 5.6  (blank = gap; @field-id = value from a field)
   source: …
   ~~~
   ========================================================================== */
function parseChartValue(s) {
  s = String(s).trim();
  if (s.startsWith('@')) s = fieldValueById(s.slice(1).trim());
  const v = parseFloat(String(s).replace(/[%\s]/g, '').replace(/,/g, '.'));
  return Number.isFinite(v) ? v : null;
}
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function fmt(v) { return String(Math.round(v * 100) / 100); }

function renderChart(raw) {
  const cfg = { series: [] };
  raw.split('\n').forEach(l => {
    const m = l.match(/^\s*([\w-]+)\s*:\s*(.*)$/);
    if (!m) return;
    const key = m[1].toLowerCase(), val = m[2].trim();
    if (key === 'series') {
      const bar = val.indexOf('|');
      const name = (bar < 0 ? val : val.slice(0, bar)).trim();
      const vals = bar < 0 ? '' : val.slice(bar + 1);
      cfg.series.push({ name, values: vals.split(',').map(parseChartValue) });
    } else cfg[key] = val;
  });
  const years = (cfg.years || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!years.length || !cfg.series.length) return '<div class="chart-error">A chart needs a "years:" line and at least one "series:" line.</div>';

  const W = 680, H = 340, L = 50, R = 18, T = 54, B = 40;
  const pw = W - L - R, ph = H - T - B;
  const vals = cfg.series.flatMap(s => s.values.slice(0, years.length)).filter(v => v != null);
  const maxV = vals.length ? Math.max(...vals, 0) : 10;
  const step = niceStep(maxV / 5);
  const top = Math.max(step, Math.ceil((maxV * 1.08) / step) * step);
  const x = i => L + (years.length === 1 ? pw / 2 : (i * pw) / (years.length - 1));
  const y = v => T + ph - (v / top) * ph;
  const projIdx = cfg['projection-from'] ? years.indexOf(cfg['projection-from'].trim()) : -1;
  let svg = '';

  // projection shading
  if (projIdx > 0) {
    const xs = (x(projIdx - 1) + x(projIdx)) / 2;
    svg += `<rect class="proj-bg" x="${xs}" y="${T}" width="${L + pw + R / 2 - xs}" height="${ph}"/>` +
           `<text class="proj-label" x="${xs + 6}" y="${T + 14}">Projections</text>`;
  }
  // gridlines + y labels
  for (let v = 0; v <= top + 1e-9; v += step) {
    const yy = y(v).toFixed(1);
    svg += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${yy}" y2="${yy}"/>` +
           `<text class="axis" x="${L - 8}" y="${+yy + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  if (cfg.unit) svg += `<text class="axis" x="4" y="${T - 14}">${esc(cfg.unit)}</text>`;
  // x labels
  years.forEach((yr, i) => { svg += `<text class="axis" x="${x(i)}" y="${T + ph + 22}" text-anchor="middle">${esc(yr)}</text>`; });

  if (!vals.length) {
    svg += `<text class="empty-msg" x="${L + pw / 2}" y="${T + ph / 2}" text-anchor="middle">No data yet — fill in the MISSING fields and the chart will draw itself.</text>`;
  }

  // series lines + points + value labels
  cfg.series.forEach((s, si) => {
    const col = SERIES_COLORS[si % SERIES_COLORS.length];
    for (let i = 0; i < years.length - 1; i++) {
      const a = s.values[i], b = s.values[i + 1];
      if (a == null || b == null) continue;
      const dashed = projIdx >= 0 && i + 1 >= projIdx;
      svg += `<line class="series-line" stroke="${col}" x1="${x(i)}" y1="${y(a)}" x2="${x(i + 1)}" y2="${y(b)}"${dashed ? ' stroke-dasharray="6 6"' : ''}/>`;
    }
    s.values.forEach((v, i) => {
      if (v == null || i >= years.length) return;
      const proj = projIdx >= 0 && i >= projIdx;
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" stroke="${col}" stroke-width="2" fill="${proj ? '#232323' : col}">` +
             `<title>${esc(s.name)}, ${esc(years[i])}: ${fmt(v)}${proj ? ' (projection)' : ''}</title></circle>` +
             `<text class="val" x="${x(i)}" y="${y(v) - 10}" text-anchor="middle" fill="${col}">${fmt(v)}</text>`;
    });
  });

  // legend
  let lx = L;
  cfg.series.forEach((s, si) => {
    const col = SERIES_COLORS[si % SERIES_COLORS.length];
    svg += `<line x1="${lx}" x2="${lx + 22}" y1="18" y2="18" stroke="${col}" stroke-width="3" stroke-linecap="round"/>` +
           `<text class="legend" x="${lx + 28}" y="22">${esc(s.name)}</text>`;
    lx += 28 + s.name.length * 6.6 + 22;
  });
  if (projIdx >= 0) {
    svg += `<line x1="${lx}" x2="${lx + 22}" y1="18" y2="18" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="5 4"/>` +
           `<text class="legend" x="${lx + 28}" y="22">Projection</text>`;
  }

  return `<figure class="chart">${cfg.title ? `<div class="chart-title">${esc(cfg.title)}</div>` : ''}` +
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.title || 'Line chart')}">${svg}</svg>` +
    `${cfg.source ? `<figcaption>Source: ${esc(cfg.source)}</figcaption>` : ''}</figure>`;
}

/* ==========================================================================
   8. SIDEBAR (tree, search, tag filter)
   ========================================================================== */
function noteMatches(n) {
  const q = state.search.toLowerCase().trim();
  if (q && !n.title.toLowerCase().includes(q) && !n.body.toLowerCase().includes(q)) return false;
  if (state.tag && !tagsOf(n).includes(state.tag)) return false;
  return true;
}

function searchSnippet(n, q) {
  if (!q || n.title.toLowerCase().includes(q)) return '';
  const line = n.body.split('\n').find(l => l.toLowerCase().includes(q));
  if (!line) return '';
  const text = plainText(line);
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return esc(truncate(text, 60));
  const start = Math.max(0, idx - 20);
  const part = (start ? '…' : '') + text.slice(start, idx + q.length + 40);
  const j = part.toLowerCase().indexOf(q);
  return esc(part.slice(0, j)) + '<mark>' + esc(part.slice(j, j + q.length)) + '</mark>' + esc(part.slice(j + q.length));
}

function renderTree() {
  const q = state.search.toLowerCase().trim();
  const filtering = !!(q || state.tag);
  const visible = state.notes.filter(noteMatches);
  let html = bpTreeHTML(q);
  for (const f of allFolders()) {
    const notes = visible.filter(n => (n.folder || 'Unfiled') === f);
    if (!notes.length && filtering) continue;
    const collapsed = state.collapsed[f] && !filtering;
    html += `<div class="folder${collapsed ? ' collapsed' : ''}">` +
      `<button class="folder-head" data-folder="${esc(f)}" aria-expanded="${!collapsed}"><span class="chev"></span>${esc(f)}<span class="count">${notes.length}</span></button>` +
      '<div class="folder-notes">' +
      notes.map(n => {
        const snip = searchSnippet(n, q);
        return `<a href="#note/${encodeURIComponent(n.id)}" class="tree-note${n.id === state.current && state.mode !== 'graph' && state.mode !== 'blueprint' ? ' active' : ''}" data-id="${esc(n.id)}">` +
          `<span class="ico">${TYPE_ICONS[n.type] || TYPE_ICONS.note}</span><span>${esc(n.title)}</span></a>` +
          (snip ? `<span class="tree-snippet">${snip}</span>` : '');
      }).join('') + '</div></div>';
  }
  if (!visible.length) html += '<p class="muted" style="padding:6px 10px;font-size:13px">No notes match.</p>';
  $('#tree').innerHTML = html;

  $('#filterInfo').innerHTML = filtering
    ? `<span>${visible.length} of ${state.notes.length} notes</span><button data-action="clear-filters">Clear filters</button>`
    : '';
  renderTagOptions();
}

function renderTagOptions() {
  const counts = {};
  state.notes.forEach(n => tagsOf(n).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const tags = Object.keys(counts).sort();
  if (state.tag && !counts[state.tag]) counts[state.tag] = 0, tags.push(state.tag);
  $('#tagFilter').innerHTML = '<option value="">All tags</option>' +
    tags.map(t => `<option value="${esc(t)}"${t === state.tag ? ' selected' : ''}>#${esc(t)} (${counts[t]})</option>`).join('');
}

/* ==========================================================================
   9. RIGHT PANEL (backlinks, outgoing links, tags, status)
   ========================================================================== */
function renderRight() {
  const right = $('#right');
  if (state.mode === 'blueprint') { unmountMiniGraph(); right.innerHTML = bpRightHTML(); return; }
  if (state.mode === 'graph') {
    unmountMiniGraph();
    const hubs = mainGraph ? mainGraph.nodes.filter(n => n.hub).sort((a, b) => b.deg - a.deg) : [];
    right.innerHTML = '<h3>Graph view</h3><p class="muted">Each dot is a note; each line is a [[wikilink]]. Bigger dots have more links. Click a dot to open it, double-click to fly to it, drag a dot to pin it.</p>' +
      '<h3>Controls</h3><ul class="legend-list"><li>Drag: rotate (3D) or pan (2D)</li><li>Shift-drag or right-drag: pan</li><li>Wheel or pinch: zoom</li><li>Legend: click a group to hide or show it</li></ul>' +
      `<h3>Hub notes <span>${hubs.length}</span></h3><p class="muted">More than ${GRAPH_LOOK.hubThreshold} links. In Tidy mode their links only show when you hover them.</p>` +
      (hubs.length ? '<ul class="rlist">' + hubs.map(n => `<li><a href="#" class="wikilink" data-id="${esc(n.id)}" data-target="${esc(n.title)}">${esc(n.title)}</a><span class="snip">${n.deg} links</span></li>`).join('') + '</ul>' : '');
    return;
  }
  const note = getNote(state.current);
  if (!note) { unmountMiniGraph(); right.innerHTML = ''; return; }

  const back = backlinks(note);
  const out = outgoingLinks(note);
  const tags = tagsOf(note);
  const c = countStatuses(scanStatusItems().filter(i => i.note.id === note.id));
  const keys = titleKeys(note);

  let html = `<h3>Backlinks <span>${back.length}</span></h3>`;
  html += back.length ? '<ul class="rlist">' + back.map(n => {
    const line = n.body.split('\n').find(l => [...l.matchAll(LINK_RE)].some(m => keys.has(normTitle(parseLink(m[1]).target)))) || '';
    return `<li><a href="#" class="wikilink" data-id="${esc(n.id)}" data-target="${esc(n.title)}">${esc(n.title)}</a><span class="snip">${esc(truncate(plainText(line), 110))}</span></li>`;
  }).join('') + '</ul>' : '<p class="muted">No other notes link here yet.</p>';

  html += `<h3>Outgoing links <span>${out.length}</span></h3>`;
  html += out.length ? '<ul class="rlist">' + out.map(t => {
    const n = findByTitle(t);
    return `<li><a href="#" class="wikilink${n ? '' : ' unresolved'}" data-target="${esc(t)}"${n ? ` data-id="${esc(n.id)}"` : ''}>${esc(n ? n.title : t)}</a>${n ? '' : '<span class="snip">Not created yet — click to create</span>'}</li>`;
  }).join('') + '</ul>' : '<p class="muted">This note has no [[links]].</p>';

  html += miniGraphHTML();

  html += '<h3>Tags</h3>' + (tags.length ? tags.map(t => `<a href="#" class="tag" data-tag="${esc(t)}">#${esc(t)}</a>`).join(' ') : '<p class="muted">No tags.</p>');

  html += '<h3>Fact status in this note</h3><div class="mini-stats">' +
    STATUSES.map(s => `<div class="${statusClass(s)}"><b>${c[s]}</b>${s}</div>`).join('') + '</div>';
  right.innerHTML = html;
  mountMiniGraph(note.id);
}

function insertAtCursor(text) {
